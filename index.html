<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="author" content="Dixitkumar Suthar">
<meta name="copyright" content="© 2026 Dixitkumar Suthar. All rights reserved.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DrillMaster Pro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>html{color-scheme:dark}:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>DrillMaster Pro</title>
<meta name="description" content="Drilling engineering formulas, kill and trip sheets, schematics and field reports.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: instrument-panel shell — fixed left rail of modules, working canvas on the right, bottom bar on phones. Pure black ground with a safety-orange accent. */
:root{
  --bg:#000000; --panel:#0b0b0b; --panel2:#151413; --line:#2a2623; --line2:#423a34;
  --fg:#f5f1ec; --muted:#a09890; --accent:#ff7a1a; --accent-ink:#160800; --accent-soft:rgba(255,122,26,.14);
  --ok:#4cc38a; --warn:#ffd23f; --crit:#ff4d4d; --ok-soft:rgba(76,195,138,.14); --warn-soft:rgba(255,210,63,.13); --crit-soft:rgba(255,92,92,.15);
  --steel:#c2b8ae; --cement:#6c655f; --hole:#2c2016;
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --tap:48px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f1ea; --panel:#ffffff; --panel2:#f8f6ef; --line:#dcd8c8; --line2:#c4bfab;
  --fg:#1a1810; --muted:#6a6553; --accent:#c2500a; --accent-ink:#ffffff; --accent-soft:rgba(194,80,10,.11);
  --ok:#1b8657; --warn:#8a6500; --crit:#c53030; --ok-soft:rgba(27,134,87,.10); --warn-soft:rgba(138,101,0,.12); --crit-soft:rgba(197,48,48,.10);
  --steel:#5d594a; --cement:#b5b1a2; --hole:#e9dfc8; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f1ea; --panel:#ffffff; --panel2:#f8f6ef; --line:#dcd8c8; --line2:#c4bfab;
  --fg:#1a1810; --muted:#6a6553; --accent:#c2500a; --accent-ink:#ffffff; --accent-soft:rgba(194,80,10,.11);
  --ok:#1b8657; --warn:#8a6500; --crit:#c53030; --ok-soft:rgba(27,134,87,.10); --warn-soft:rgba(138,101,0,.12); --crit-soft:rgba(197,48,48,.10);
  --steel:#5d594a; --cement:#b5b1a2; --hole:#e9dfc8; color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-disp);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:30px}
h2{font-size:21px}
h3{font-size:18px}
p{margin:0}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font:600 11px/1.2 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px 24px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;text-decoration:none;color:var(--fg)}
.brand svg{flex:none}
.brand b{font:700 21px/1 var(--f-disp);letter-spacing:.02em}
.brand small{display:block;font:500 11px/1.3 var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.navgrp{display:flex;flex-direction:column;gap:2px}
.navgrp .eyebrow{padding:0 10px 6px}
.navgrp a{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-weight:500}
.navgrp a:hover{background:var(--panel2)}
.navgrp a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.navgrp a .tag{margin-left:auto;font:600 10px/1 var(--f-mono);padding:3px 5px;border-radius:4px;background:var(--panel2);color:var(--muted);letter-spacing:.05em}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .menu{display:none}
.wellpick{display:flex;align-items:center;gap:8px;min-width:0}
.wellpick select{max-width:240px}
.top .spacer{flex:1}
.badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;font:600 11px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.badge.off{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
#view{padding:24px 24px 48px;display:flex;flex-direction:column;gap:20px;max-width:1320px;width:100%}
.bnav{display:none}
.scrim{display:none}

/* primitives */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.flat{background:var(--panel2)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;justify-content:space-between}
.pagehead p{max-width:68ch;color:var(--muted);margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 16px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);font:600 14px/1 var(--f-body);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit)}
.btn.icon{width:var(--tap);padding:0}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line2);border-radius:8px;min-height:var(--tap);padding:0 12px;width:100%;min-width:0}
textarea{padding:10px 12px;min-height:90px;resize:vertical}
input[type="number"]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input.bad{border-color:var(--crit);box-shadow:0 0 0 3px var(--crit-soft)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:13px;color:var(--muted);font-weight:500}
.inrow{display:flex;min-width:0}
.inrow input{border-radius:8px 0 0 8px;flex:1}
.inrow select,.inrow .u{flex:none;width:auto;max-width:112px;border-radius:0 8px 8px 0;border-left:0;background:var(--panel2);font:500 13px var(--f-mono);padding:0 8px}
.inrow .u{display:flex;align-items:center;border:1px solid var(--line2);border-left:0;color:var(--muted);white-space:nowrap}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0;min-width:0}
legend{font:600 12px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0 6px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{min-height:40px;padding:0 14px;background:transparent;border:0;color:var(--muted);font:600 13px var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--muted);font:600 13px var(--f-body);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font:600 12px/1.3 var(--f-mono);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px}
.note.info{border-color:var(--accent);background:var(--accent-soft)}
.note.crit{border-color:var(--crit);background:var(--crit-soft)}

/* readouts */
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ro{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ro .v{font:600 26px/1.1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg)}
.ro .v small{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px}
.ro.key .v{color:var(--accent)}
.ro.warn{border-color:var(--warn)} .ro.warn .v{color:var(--warn)}
.ro.crit{border-color:var(--crit)} .ro.crit .v{color:var(--crit)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--panel2);position:sticky;top:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.warn td{background:var(--warn-soft)}
tr.crit td{background:var(--crit-soft)}
td input,td select{min-height:38px;padding:0 8px;font-size:14px}
td input[type="number"]{width:96px}
td input.w{width:190px}

/* formulas */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:stretch}
.fcard{display:flex;flex-direction:column;gap:12px}
.fcard header{display:flex;flex-direction:column;gap:4px}
.fcard p{font-size:14px;color:var(--muted)}
.fcard .ins{display:flex;flex-direction:column;gap:8px}
.fcard .ins .fld{display:grid;grid-template-columns:minmax(0,1fr) 200px;align-items:center;gap:10px}
.fcard .ins .fld>span{line-height:1.3}
.fcard .inrow input{padding:0 10px;text-align:right}
.fcard .inrow .ubtn,.fcard .inrow .u{width:98px;font-size:12px;padding:0 8px;justify-content:space-between}
.fcard .inrow .u{justify-content:flex-start}
.fcard .res .ubtn,.fcard .res .u{width:98px;flex:none;justify-content:space-between}
.fcard .res .u{display:inline-flex;align-items:center;padding:0 8px;min-height:34px}
.fcard .res span:first-child{flex:1;min-width:0;line-height:1.3}
.fcard .res b{margin-left:0;white-space:nowrap}
.res{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.res span{font-size:13px;color:var(--muted)}
.res b{font:600 16px var(--f-mono);font-variant-numeric:tabular-nums;margin-left:auto}
.res.final{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:var(--accent-soft)}
.res.final b{color:var(--accent);font-size:20px}
.res select,.res .u{width:auto;min-height:32px;font:500 12px var(--f-mono);padding:0 6px;background:var(--bg);border-radius:6px;color:var(--muted)}
.res .u{border:0;background:transparent}
details.work summary{cursor:pointer;font:600 13px var(--f-body);color:var(--accent);min-height:32px;display:flex;align-items:center}
details.work pre{margin:8px 0 0;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font:12.5px/1.6 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
.ubtn{flex:none;display:inline-flex;align-items:center;justify-content:space-between;gap:6px;min-height:var(--tap);padding:0 10px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);font:600 13px var(--f-mono);cursor:pointer;white-space:nowrap}
.ubtn::after{content:"▾";color:var(--accent);font-size:12px}
.ubtn:hover{border-color:var(--accent)}
.inrow .ubtn{border-left:0;border-radius:0 8px 8px 0}
.res .ubtn{min-height:34px;border-radius:6px;background:var(--bg);font-size:12px;padding:0 8px}
.ubar .ubtn,.ubtn.big{width:100%;border-radius:8px}
.ubtn.big{font-size:15px}
.usheet .card{width:min(420px,100%);max-height:86vh;overflow-y:auto}
.uopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.uopt{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:60px;padding:8px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);cursor:pointer;text-align:left;min-width:0}
.uopt b{font:600 17px var(--f-mono)}
.uopt span{font:12.5px var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.uopt:hover{border-color:var(--accent)}
.uopt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.uopt[aria-pressed="true"] b{color:var(--accent)}
.ubar{display:flex;flex-direction:column;gap:10px}
.ubar-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;align-items:end}
.ubar select{min-height:42px;font:500 14px var(--f-mono)}
.fcard .foot{margin-top:auto;display:flex;gap:8px;align-items:center;justify-content:space-between}
.err{color:var(--crit);font-size:13px}

/* charts & schematics */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line2)}
.schem{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:8px;overflow:auto;display:flex;justify-content:center}
.schem svg{max-width:100%;height:auto}
canvas.d3{width:100%;height:340px;display:block;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);touch-action:none;cursor:grab}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:stretch}
.hero .card.lead{background:linear-gradient(160deg,var(--panel2),var(--panel));display:flex;flex-direction:column;gap:14px;justify-content:space-between}
.hero h1{font-size:40px}
.tile{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--fg);transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile b{font:600 17px var(--f-disp);letter-spacing:.02em}
.tile span{font-size:13.5px;color:var(--muted)}
.search{position:relative}
.search input{padding-left:40px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:320px;max-height:60vh;overflow-y:auto;padding:4px}
.msg{max-width:78ch;padding:10px 14px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.msg.a{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}

/* overlays */
.modal{position:fixed;inset:0;z-index:60;background:rgba(3,8,15,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{width:min(440px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.3)}

/* alerts timeline */
.tl{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto}
.tl div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14px;padding:8px 10px;border-radius:8px;background:var(--panel2)}

.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,180px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.bar .bl{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bt{height:12px;background:var(--panel2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar .bt i{display:block;height:100%;border-radius:6px}
.bar .bv{font-size:12.5px;white-space:nowrap}
.chk{display:flex;gap:12px;align-items:flex-start;min-height:var(--tap);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer}
.chk input{width:22px;min-height:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--accent)}
.chk:has(input:checked){border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;max-width:70ch}
.chip.mcq{text-align:left;white-space:normal;border-radius:10px;min-height:44px;padding:8px 12px;color:var(--fg)}
.chip.mcq.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.chip.mcq.bad{border-color:var(--crit);background:var(--crit-soft);color:var(--crit)}
.chip.mcq[disabled]{cursor:default;opacity:1}
.sharebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 24px;border-bottom:1px solid var(--line);font-size:13px;min-height:38px}
#histbox{padding:0 24px 48px;max-width:1320px;width:100%}
#histbox:empty{display:none}
#histbox .btn{white-space:normal;text-align:center}
#histbox .card{min-width:0}
.dev{font-size:12.5px;padding:10px;margin:0 2px;border:1px solid var(--line);border-radius:8px;color:var(--muted);line-height:1.5}
.dev b{color:var(--fg)}
.dev .mono{font-size:11.5px;overflow-wrap:anywhere;user-select:all}
.tu{gap:8px}
.tu .ubtn{border-radius:8px;min-height:38px}
.star{background:none;border:0;cursor:pointer;font-size:18px;color:var(--muted);min-width:36px;min-height:36px}

/* ===== DrillMaster glass theme: charcoal #121212, industrial orange #FF6B00, frosted cards ===== */
:root{
  --bg:#121212; --panel:#181818; --panel2:#1f1f1f; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#ffffff; --muted:#9a9a9f; --accent:#ff6b00; --accent-ink:#ffffff; --accent-soft:rgba(255,107,0,.13);
  --glass:linear-gradient(155deg,rgba(255,255,255,.065),rgba(255,255,255,.018)); --glass2:rgba(255,255,255,.035);
  --glow:0 0 0 1px rgba(255,107,0,.35),0 10px 40px -12px rgba(255,107,0,.45);
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
:root[data-theme="light"]{--glass:linear-gradient(155deg,rgba(255,255,255,.92),rgba(255,255,255,.7));--glass2:rgba(0,0,0,.025);--glow:0 0 0 1px rgba(194,80,10,.3),0 10px 30px -14px rgba(194,80,10,.35)}

.btn.pri:hover{box-shadow:0 8px 26px -6px rgba(255,107,0,.8)}

input,select,textarea{background:rgba(0,0,0,.28);border-color:var(--line2);border-radius:10px}

.ubtn{background:rgba(255,255,255,.04)}

.gauge.warn{border-color:rgba(255,210,63,.45)} .gauge.crit{border-color:rgba(255,77,77,.55);box-shadow:0 0 0 1px rgba(255,77,77,.3),0 10px 36px -12px rgba(255,77,77,.5)}

@media (max-width:1380px){.gauges.six{grid-template-columns:repeat(3,minmax(0,1fr))}}

const KDEF={md:10500,tvd:10000,shoeMd:5100,shoeTvd:5000,hole:8.5,lot:14.5,omw:10,po:0.1,scrSpm:30,scr:600,dpLen:9400,dpCap:0.01776,hwLen:500,hwCap:0.0087,dcLen:600,dcCap:0.0077,dcOh:0.0292,dpOh:0.0459,dpCsg:0.0489,sidpp:400,sicp:600,gain:20,ki:0.5,gg:0.1,gmDp:100,gmHr:1,gf:50};
const KF=[
 ['Well and shoe',[['md','Measured depth','len'],['tvd','True vertical depth','len'],['shoeMd','Casing shoe MD','len'],['shoeTvd','Casing shoe TVD','len'],['hole','Hole size','dia'],['lot','Fracture EMW at shoe (LOT/FIT)','dens']]],
 ['Mud and pump',[['omw','Original mud weight','dens'],['po','Pump output','stk'],['scrSpm','Slow circulating rate','spm'],['scr','Pressure at slow rate (SCR)','pres']]],
 ['Drill string',[['dpLen','Drill pipe length','len'],['dpCap','Drill pipe capacity','cap'],['hwLen','HWDP length','len'],['hwCap','HWDP capacity','cap'],['dcLen','Drill collar length','len'],['dcCap','Drill collar capacity','cap']]],
 ['Annulus capacities',[['dcOh','Collars × open hole','cap'],['dpOh','DP/HWDP × open hole','cap'],['dpCsg','DP × casing','cap']]],
 ['Kick data',[['sidpp','SIDPP','pres'],['sicp','SICP','pres'],['gain','Pit gain','vol']]],
 ['Kick tolerance and gas migration',[['ki','Kick intensity','dens'],['gg','Influx gradient','grad'],['gf','Gas fraction for multi-bubble estimate','%'],['gmDp','Rise in SICP while shut in','pres'],['gmHr','Over a period of','hr']]]
];
function killCalc(d){
  const r={warn:[]};
  r.ds=d.dpCap*d.dpLen+d.hwCap*d.hwLen+d.dcCap*d.dcLen;
  r.ohLenDP=Math.max(0,d.md-d.shoeMd-d.dcLen);
  r.annOH=d.dcOh*Math.min(d.dcLen,d.md-d.shoeMd)+d.dpOh*r.ohLenDP;
  r.annCsg=d.dpCsg*d.shoeMd;r.ann=r.annOH+r.annCsg;
  r.stkBit=r.ds/d.po;r.stkShoe=r.annOH/d.po;r.stkSurf=r.ann/d.po;r.stkTot=r.stkBit+r.stkSurf;
  r.minBit=r.stkBit/d.scrSpm;r.minSurf=r.stkSurf/d.scrSpm;r.minTot=r.stkTot/d.scrSpm;
  r.kmw=d.omw+d.sidpp/(0.052*d.tvd);r.kmwR=Math.ceil(r.kmw*10-1e-9)/10;
  r.icp=d.scr+d.sidpp;r.fcp=d.scr*r.kmwR/d.omw;
  r.pf=d.sidpp+0.052*d.omw*d.tvd;
  r.maasp=(d.lot-d.omw)*0.052*d.shoeTvd;r.maaspK=(d.lot-r.kmwR)*0.052*d.shoeTvd;
  const dcAnnV=d.dcOh*d.dcLen;
  r.hInf=d.gain<=dcAnnV?d.gain/d.dcOh:d.dcLen+(d.gain-dcAnnV)/d.dpOh;
  r.gInf=0.052*d.omw-(d.sicp-d.sidpp)/r.hInf;
  r.type=r.gInf<0.25?['Gas likely','crit']:r.gInf<=0.4?['Oil or mixed influx','warn']:['Water likely','info'];
  r.kt=ki=>{const hmax=((d.lot-d.omw)*0.052*d.shoeTvd-ki*0.052*d.tvd)/(0.052*d.omw-d.gg);if(!(hmax>0))return{h:hmax,v:0,vGeo:0,vShoe:0};
    const vGeo=hmax<=d.dcLen?hmax*d.dcOh:d.dcLen*d.dcOh+(hmax-d.dcLen)*d.dpOh;
    const pShoe=d.lot*0.052*d.shoeTvd,pBot=(d.omw+ki)*0.052*d.tvd;const vShoe=hmax*d.dpOh*pShoe/pBot;
    return{h:hmax,v:Math.min(vGeo,vShoe),vGeo,vShoe}};
  r.KT=r.kt(d.ki);
  r.ktm=ki=>{const s1=r.kt(ki),f=Math.min(1,Math.max(0.05,d.gf/100));if(!(s1.h>0))return{h:0,v:0};const hm=Math.min(s1.h/f,Math.max(0,d.md-d.shoeMd));const vg=(hm<=d.dcLen?hm*d.dcOh:d.dcLen*d.dcOh+(hm-d.dcLen)*d.dpOh)*f;return{h:hm,v:Math.max(s1.v,Math.min(vg,s1.vShoe))}};r.KTm=r.ktm(d.ki);
  r.migr=d.gmDp/(0.052*d.omw)/d.gmHr;
  r.sched=Array.from({length:11},(_,i)=>({step:i,stk:r.stkBit*i/10,min:r.stkBit*i/10/d.scrSpm,p:r.icp-(r.icp-r.fcp)*i/10}));
  const strLen=d.dpLen+d.hwLen+d.dcLen;
  if(Math.abs(strLen-d.md)>d.md*0.01)r.warn.push(['warn',`String length (${fmt(strLen)} ft) differs from MD (${fmt(d.md)} ft). Check pipe lengths.`]);
  if(d.tvd>d.md)r.warn.push(['crit','TVD is greater than MD. Check depths.']);
  if(d.sicp<d.sidpp)r.warn.push(['warn','SICP is lower than SIDPP. Possible influx inside the string or a gauge problem. Verify readings.']);
  if(d.sicp>=r.maasp)r.warn.push(['crit','SICP has reached initial MAASP. Risk of shoe breakdown.']);
  if(d.gain>r.KT.v)r.warn.push(['crit','Pit gain exceeds calculated kick tolerance.']);
  if(d.shoeTvd>d.tvd||d.shoeMd>d.md)r.warn.push(['crit','Shoe is deeper than the well. Check shoe depths.']);
  return r;
}

const TDEF=()=>({dir:'out',mw:10,depth:10000,standLen:93,pipe:'5" DP 19.5 lb/ft',mode:'dry',disp:0.0075,cap:0.01776,tol:1,start:40,driller:'',tp:'',rows:[{st:5,tank:36.5,rem:'',t:'06:00'},{st:5,tank:33.0,rem:'',t:'06:25'},{st:5,tank:29.6,rem:'',t:'06:50'},{st:5,tank:26.2,rem:'',t:'07:15'},{st:5,tank:23.9,rem:'Hole took less than calculated',t:'07:40'},{st:5,tank:20.4,rem:'',t:'08:05'}]});
function tripCalc(d){
  const per=d.mode==='wet'?d.disp+d.cap:d.disp;let cumSt=0,cumCalc=0,prev=d.start;
  return d.rows.map(r=>{cumSt+=r.st;const calc=r.st*d.standLen*per;cumCalc+=calc;const act=d.dir==='out'?prev-r.tank:r.tank-prev;prev=r.tank;const cumAct=d.dir==='out'?d.start-r.tank:r.tank-d.start;const disc=cumAct-cumCalc;
    const bit=d.dir==='out'?d.depth-cumSt*d.standLen:d.depth+cumSt*d.standLen;
    const a=Math.abs(disc);const lvl=a>2*d.tol?'crit':a>d.tol?'warn':'ok';
    let msg='';if(lvl!=='ok'){msg=d.dir==='out'?(disc<0?'Hole taking less than calculated: possible swabbed influx. Flow check.':'Hole taking more than calculated: possible losses.'):(disc>0?'More returns than calculated: possible influx. Flow check.':'Less returns than calculated: possible losses.')}
    return{...r,cumSt,calc,cumCalc,act,cumAct,disc,bit,lvl,msg}});
}

    const g=span*1.1;for(let i=-4;i<=4;i++){const a=P([i*g/4,-g,0]),b=P([i*g/4,g,0]),c1=P([-g,i*g/4,0]),d1=P([g,i*g/4,0]);x.beginPath();x.moveTo(...a);x.lineTo(...b);x.moveTo(...c1);x.lineTo(...d1);x.stroke()}
    const N=P([0,g*1.15,0]);x.fillText('N',N[0]-4,N[1]);const E=P([g*1.15,0,0]);x.fillText('E',E[0]-4,E[1]);
    x.strokeStyle=CSSV('--muted');x.setLineDash([3,4]);x.beginPath();x.moveTo(...P([0,0,0]));x.lineTo(...P([0,0,maxT]));x.stroke();x.setLineDash([]);
    x.strokeStyle=CSSV('--warn');x.lineWidth=2;x.setLineDash([6,4]);x.beginPath();x.moveTo(...P([d.off.e,d.off.n,0]));x.lineTo(...P([d.off.e,d.off.n,d.off.td]));x.stroke();x.setLineDash([]);
    x.strokeStyle=CSSV('--accent');x.lineWidth=3;x.beginPath();st.forEach((p,i)=>{const q=P([p.e,p.n,p.tvd]);i?x.lineTo(...q):x.moveTo(...q)});x.stroke();
    const tdp=P([st[st.length-1].e,st[st.length-1].n,st[st.length-1].tvd]);x.fillStyle=CSSV('--accent');x.beginPath();x.arc(tdp[0],tdp[1],5,0,7);x.fill();x.fillStyle=CSSV('--fg');x.fillText('TD '+L(st[st.length-1].md)+' '+LU,tdp[0]+8,tdp[1]+4)};
  draw();
};

const WDEF=()=>({td:10500,items:[
 {id:uid(),type:'Conductor',label:'Conductor',od:20,id_:19.124,top:0,bot:300,toc:0,hole:26},
 {id:uid(),type:'Casing',label:'Surface casing',od:13.375,id_:12.415,top:0,bot:2500,toc:0,hole:17.5},

 {id:uid(),type:'Liner',label:'Production liner',od:7,id_:6.184,top:7800,bot:10400,toc:7800,hole:8.5},
 {id:uid(),type:'Tubing',label:'Tubing',od:3.5,id_:2.992,top:0,bot:9900,toc:0,hole:0},
 {id:uid(),type:'Packer',label:'Production packer',od:6.1,id_:2.992,top:9850,bot:9860,toc:0,hole:0}]});
const WTYPES=['Conductor','Casing','Liner','Tubing','Packer'];
function wellSVG(d,pal,sys){
  const W=680,H=680,T=34,B=36,cx=215;const it=d.items.filter(i=>Number.isFinite(i.bot));const maxD=Math.max(d.td||0,...it.map(i=>i.bot),100);
  const y=v=>T+v/maxD*(H-T-B);const maxHalf=Math.max(...it.map(i=>Math.max(i.hole||0,i.od||0)),8.5)/2;const k=120/maxHalf;const X=r=>r*k;
  const strings=it.filter(i=>['Conductor','Casing','Liner'].includes(i.type)).sort((a,b)=>b.od-a.od);
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="${pal.font}" font-size="11"><rect width="${W}" height="${H}" fill="${pal.bg}"/>`;
  const deepest=strings.reduce((a,b)=>b.bot>(a?.bot||0)?b:a,null);const ohHole=deepest?deepest.hole||deepest.od:8.5;
  s+=`<rect x="${cx-X(maxHalf)-14}" y="${T}" width="${X(maxHalf)*2+28}" height="${H-T-B}" fill="${pal.hole}" opacity=".55"/>`;
  s+=`<line x1="${cx-X(maxHalf)-24}" x2="${cx+X(maxHalf)+24}" y1="${T}" y2="${T}" stroke="${pal.fg}" stroke-width="2"/><text x="${cx-X(maxHalf)-24}" y="${T-8}" fill="${pal.muted}">Surface / wellhead</text>`;
  if(deepest&&maxD>deepest.bot){s+=`<path d="M${cx-X(ohHole/2)} ${y(deepest.bot)}V${y(maxD)}M${cx+X(ohHole/2)} ${y(deepest.bot)}V${y(maxD)}" stroke="${pal.muted}" stroke-dasharray="4 4" fill="none"/><rect x="${cx-X(ohHole/2)}" y="${y(deepest.bot)}" width="${X(ohHole)}" height="${y(maxD)-y(deepest.bot)}" fill="${pal.bg}" opacity=".5"/>`}
  strings.forEach(c=>{const hh=(c.hole||c.od)/2,oh=c.od/2,t=Math.max(c.toc??c.top,c.top);if(hh>oh&&c.bot>t){[-1,1].forEach(sg=>{s+=`<rect x="${sg<0?cx-X(hh):cx+X(oh)}" y="${y(t)}" width="${X(hh-oh)}" height="${y(c.bot)-y(t)}" fill="${pal.cement}"/>`})}});
  strings.forEach(c=>{const oh=X(c.od/2);s+=`<path d="M${cx-oh} ${y(c.top)}V${y(c.bot)}M${cx+oh} ${y(c.top)}V${y(c.bot)}" stroke="${pal.steel}" stroke-width="3.2" fill="none"/>`;
    s+=`<path d="M${cx-oh} ${y(c.bot)}l-8 0l8 -9zM${cx+oh} ${y(c.bot)}l8 0l-8 -9z" fill="${pal.steel}"/>`;
    if(c.type==='Liner')s+=`<path d="M${cx-oh-6} ${y(c.top)}h12M${cx+oh-6} ${y(c.top)}h12" stroke="${pal.fg}" stroke-width="3"/>`});
  it.filter(i=>i.type==='Tubing').forEach(t=>{const oh=X(t.od/2);s+=`<path d="M${cx-oh} ${y(t.top)}V${y(t.bot)}M${cx+oh} ${y(t.top)}V${y(t.bot)}" stroke="${pal.accent}" stroke-width="2.2" fill="none"/>`});
  it.filter(i=>i.type==='Packer').forEach(p=>{const host=strings.filter(c=>c.top<=p.top&&c.bot>=p.top).sort((a,b)=>a.od-b.od)[0];const inner=it.find(t=>t.type==='Tubing'&&t.top<=p.top&&t.bot>=p.top);const ro=host?(host.id_||host.od)/2:p.od/2,ri=inner?inner.od/2:(p.id_||2)/2;const yy=y(p.top);[-1,1].forEach(sg=>{const x0=sg<0?cx-X(ro):cx+X(ri);s+=`<rect x="${x0}" y="${yy-6}" width="${X(ro-ri)}" height="12" fill="${pal.crit}" opacity=".85"/>`})});
  const labels=it.map(i=>{const dep=i.type==='Packer'?i.top:i.bot;const txt=`${i.label||i.type}  ${frac(i.od)}"  @ ${DN('len',dep,sys,0)} ${sysUnit('len',sys)}`+(['Casing','Liner','Conductor'].includes(i.type)&&i.toc>i.top?`  TOC ${DN('len',i.toc,sys,0)}`:'');return{y:y(dep),x:cx+X(i.type==='Packer'?i.od/2:i.od/2),txt}}).sort((a,b)=>a.y-b.y);
  let lastY=-99;labels.forEach(l=>{const ly=Math.max(l.y,lastY+15);lastY=ly;s+=`<path d="M${l.x+4} ${l.y}L${cx+X(maxHalf)+34} ${ly}H${cx+X(maxHalf)+40}" stroke="${pal.muted}" fill="none" stroke-width=".8"/><text x="${cx+X(maxHalf)+44}" y="${ly+4}" fill="${pal.fg}">${esc(l.txt)}</text>`});
  const step=[100,250,500,1000,2000,2500,5000].find(v=>maxD/v<=10)||5000;for(let v=0;v<=maxD;v+=step){s+=`<line x1="56" x2="62" y1="${y(v)}" y2="${y(v)}" stroke="${pal.muted}"/><text x="52" y="${y(v)+4}" text-anchor="end" fill="${pal.muted}" font-size="10">${DN('len',v,sys,0)}</text>`}
  s+=`<line x1="62" x2="62" y1="${T}" y2="${H-B}" stroke="${pal.muted}"/><text x="${cx}" y="${H-12}" text-anchor="middle" fill="${pal.fg}">TD ${DN('len',maxD,sys,0)} ${sysUnit('len',sys)} MD</text></svg>`;
  return s;
}

function bopSVG(d,pal,sys){

    else if(r.type==='Ram')s+=`<rect x="${cx-90}" y="${y+2}" width="180" height="${h-4}" ${fill} ${st}/><rect x="${cx-150}" y="${y+h*0.2}" width="60" height="${h*0.6}" ${fill} ${st}/><rect x="${cx+90}" y="${y+h*0.2}" width="60" height="${h*0.6}" ${fill} ${st}/><rect x="${cx-88}" y="${mid-5}" width="${/blind|shear/i.test(r.note+r.name)?176:72}" height="10" fill="${pal.accent}"/>${/blind|shear/i.test(r.note+r.name)?'':`<rect x="${cx+16}" y="${mid-5}" width="72" height="10" fill="${pal.accent}"/>`}`;

    y+=h});

 ops:[{f:'00:00',t:'06:00',c:'DRL',npt:false,cat:'',x:'Drill 8,450–8,690 ft, WOB 25 klbf, 120 rpm, 520 gpm'},{f:'06:00',t:'06:30',c:'SUR',npt:false,cat:'',x:'MWD survey at 8,690 ft'},{f:'06:30',t:'08:00',c:'REP',npt:true,cat:'Rig equipment',x:'Replace top-drive hydraulic hose'},{f:'08:00',t:'18:00',c:'DRL',npt:false,cat:'',x:'Drill 8,690–9,120 ft'},{f:'18:00',t:'19:00',c:'CIR',npt:false,cat:'',x:'Circulate hole clean'},{f:'19:00',t:'24:00',c:'TRP',npt:false,cat:'',x:'POOH for bit change'}],
 bit:{no:'4',size:'8-1/2"',type:'PDC 6-blade',iadc:'M323',noz:'6 × 12/32',hrs:'22',dull:'1-2-WT-S-X-I-NO-PR'},bha:'Bit, mud motor 6-3/4", MWD, 3 × 6-1/2" DC, jar, 15 × 5" HWDP',
 mud:{type:'WBM KCl-polymer',mw:'10.0 ppg',fv:'48 s/qt',pv:'18 cP',yp:'16 lb/100ft²',gels:'4/8/12',ph:'9.5',cl:'32,000 mg/L',solids:'8%'},

const hrs=(f,t)=>{const p=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?+m[1]+m[2]/60:NaN};let a=p(f),b=p(t);if(!Number.isFinite(a)||!Number.isFinite(b))return NaN;if(b<a)b+=24;return b-a};

  <div class="stack"><h2>Operations</h2><div class="tbl"><table><thead><tr><th>From</th><th>To</th><th class="n">Hours</th><th>Code</th><th>NPT</th><th>NPT category</th><th>Description</th><th></th></tr></thead><tbody id="rops"></tbody></table></div><div class="row"><button class="btn" id="rAdd">Add operation</button></div></div>

  <div class="stack"><fieldset><legend>BHA</legend><textarea id="r-bha">${esc(d.bha)}</textarea></fieldset><fieldset><legend>Safety</legend><div class="stack">${Object.entries({inc:'Incidents / LTI',obs:'Observations',drills:'Drills held'}).map(([k,l])=>`<label class="fld"><span>${l}</span><input data-saf="${k}" value="${esc(d.safety[k])}"></label>`).join('')}</div></fieldset></div></div>`;
  const ops=()=>{$('#rops').innerHTML=d.ops.map((o,i)=>`<tr data-i="${i}" class="${o.npt?'warn':''}"><td><input data-f="f" value="${esc(o.f)}" style="width:70px" aria-label="From"></td><td><input data-f="t" value="${esc(o.t)}" style="width:70px" aria-label="To"></td><td class="n">${fmt(hrs(o.f,o.t),2)}</td><td><select data-f="c" style="width:190px">${Object.entries(OPC).map(([k,l])=>`<option value="${k}"${k===o.c?' selected':''}>${k} · ${l}</option>`).join('')}</select></td><td><input type="checkbox" data-f="npt" ${o.npt?'checked':''} style="width:22px;min-height:22px" aria-label="NPT"></td><td><select data-f="cat" style="width:170px"><option value="">—</option>${NPTC.map(c=>`<option${c===o.cat?' selected':''}>${c}</option>`).join('')}</select></td><td><input class="w" data-f="x" value="${esc(o.x)}" style="width:320px"></td><td><button class="btn sm ghost danger" data-del="${i}" aria-label="Delete">✕</button></td></tr>`).join('');sum()};
  const sum=()=>{const t=tot();$('#rsum').innerHTML=`<div class="readouts"><div class="ro ${Math.abs(t.total-24)>0.01?'warn':''}"><span class="eyebrow">Hours logged</span><span class="v">${fmt(t.total,2)}<small>/ 24</small></span></div><div class="ro"><span class="eyebrow">Progress</span><span class="v">${DN('len',t.prog,sys,0)}<small>${sysUnit('len',sys)}</small></span></div><div class="ro"><span class="eyebrow">On-bottom ROP</span><span class="v">${DN('rop',t.rop,sys,1)}<small>${sysUnit('rop',sys)}</small></span></div><div class="ro ${t.npt?'warn':''}"><span class="eyebrow">NPT</span><span class="v">${fmt(t.npt,2)}<small>hr · ${fmt(t.total?t.npt/t.total*100:0,1)}%</small></span></div></div>`};
  v.oninput=v.onchange=e=>{const el=e.target;
    if(el.id==='r-no')d.no=num(el.value);else if(el.id==='r-date')d.date=el.value;else if(el.id==='r-sum')d.sum=el.value;else if(el.id==='r-plan')d.plan=el.value;else if(el.id==='r-bha')d.bha=el.value;
    else if(el.dataset.k){const x=readU(el,sys);if(Number.isFinite(x))d[el.dataset.k]=x;sum()}
    else if(el.dataset.bit)d.bit[el.dataset.bit]=el.value;else if(el.dataset.mud)d.mud[el.dataset.mud]=el.value;else if(el.dataset.saf)d.safety[el.dataset.saf]=el.value;
    else{const tr=el.closest('tr[data-i]');if(tr){const o=d.ops[+tr.dataset.i];const f=el.dataset.f;o[f]=f==='npt'?el.checked:el.value;if(e.type==='change'&&(f==='npt'||f==='f'||f==='t'))ops();else sum()}}
    save()};
  v.onclick=e=>{const b=e.target.closest('[data-del]');if(b){d.ops.splice(+b.dataset.del,1);save();ops()}};
  $('#rAdd').onclick=()=>{const last=d.ops[d.ops.length-1];d.ops.push({f:last?last.t:'00:00',t:'',c:'DRL',npt:false,cat:'',x:''});save();ops()};
  $('#rNew').onclick=e=>confirmBtn(e.target,'Tap again to start a blank report',()=>{const n=(d.no||0)+1;d={...RDEF(),no:n,d0:d.d1,d1:d.d1,sum:'',plan:'',ops:[{f:'00:00',t:'',c:'DRL',npt:false,cat:'',x:''}]};save();render()});
  $('#rExp').onclick=()=>exportDialog({title:'Daily drilling report',file:'DDR',landscape:true,build:()=>{const t=tot();return{title:`Daily drilling report #${d.no} · ${d.date}`,file:'DDR_'+d.no,landscape:true,meta:[['Report date',d.date],['Depth 00:00',DV('len',d.d0,sys,0)],['Depth 24:00',DV('len',d.d1,sys,0)],['Progress',DV('len',t.prog,sys,0)],['On-bottom ROP',DV('rop',t.rop,sys,1)],['NPT',fmt(t.npt,2)+' hr'],['24-hour summary',d.sum],['Next 24 hours',d.plan],['BHA',d.bha]],
    tables:[{title:'Operations',head:['From','To','Hours','Code','Operation','NPT','NPT category','Description'],body:d.ops.map(o=>[o.f,o.t,fmt(hrs(o.f,o.t),2),o.c,OPC[o.c],o.npt?'Yes':'',o.cat,o.x])},{title:'Bit',head:['Item','Value'],body:Object.entries(d.bit)},{title:'Mud',head:['Property','Value'],body:Object.entries(d.mud)},{title:'Safety',head:['Item','Value'],body:Object.entries(d.safety)}]}}});
  ops();
};

/* ---------- live dashboard (simulated WITSML) ---------- */
const LIVE={pts:[],t:0,on:true,mode:null,alerts:[],base:{depth:9120}};
function liveTick(){const L=LIVE;const p=L.pts[L.pts.length-1]||{t:0,depth:L.base.depth,rop:55,mw:10,pit:480,hook:252,spp:3050,flow:62,tq:12};const n=()=>(Math.random()-.5)*2;
  const q={t:p.t+1,mw:10+n()*0.02};q.rop=Math.max(5,55+n()*8+(L.mode==='stuck'?-30:0));q.depth=p.depth+q.rop/60;
  q.pit=p.pit+n()*0.15+(L.mode==='kick'?0.45:L.mode==='loss'?-0.5:0)-(p.pit-480)*0.01*(L.mode?0:1);
  q.flow=62+n()*1.2+(L.mode==='kick'?9:L.mode==='loss'?-12:0);q.hook=252+n()*2.5+(L.mode==='stuck'?Math.min(40,(q.t-(L.modeAt||q.t))*1.5):0);q.tq=12+n()*0.6+(L.mode==='stuck'?Math.min(8,(q.t-(L.modeAt||q.t))*0.3):0);q.spp=3050+n()*35+(L.mode==='loss'?-180:0);
  L.pts.push(q);if(L.pts.length>150)L.pts.shift();
  const w=L.pts.slice(-40,-5);const z=k=>{if(w.length<20)return 0;const m=w.reduce((a,b)=>a+b[k],0)/w.length,s=Math.sqrt(w.reduce((a,b)=>a+(b[k]-m)**2,0)/w.length)||1;return (q[k]-m)/s};
  const tenAgo=L.pts[Math.max(0,L.pts.length-11)];const dPit=q.pit-tenAgo.pit;
  const push=(lvl,msg,cause)=>{const last=L.alerts[0];if(last&&last.msg===msg&&q.t-last.t<15)return;L.alerts.unshift({t:q.t,lvl,msg,cause,clock:new Date().toTimeString().slice(0,8)});if(L.alerts.length>40)L.alerts.pop()};
  if(dPit>5)push('crit',`Pit volume up ${fmt(dPit,1)} bbl in 10 min`,'Flow out and pit gain rising together: possible kick. Stop drilling, flow check, shut in if flowing.');
  else if(dPit<-5)push('warn',`Pit volume down ${fmt(-dPit,1)} bbl in 10 min`,'Pit loss with lower flow out and falling SPP: possible losses. Reduce pump rate, monitor, prepare LCM.');
  if(z('flow')>3.5)push('warn','Flow-out anomaly (z > 3.5)','Flow out well above its recent baseline. Check for influx or surface transfer.');
  if(z('tq')>3.5&&z('hook')>3)push('crit','Torque and hook-load anomaly','Rising torque and overpull with falling ROP: possible pack-off or differential sticking. Work pipe, check hole cleaning.');
}
/* ---------- radial gauges ---------- */
const GCFG={rop:['ROP',0,200,'ft/hr',150,180,1],spp:['Standpipe',0,5000,'psi',4200,4700,0],hook:['Hook load',0,500,'klbf',400,460,0],tq:['Torque',0,30,'kft·lbf',20,25,1],mw:['Mud weight',8,18,'ppg',16,17,2],flow:['Flow out',0,100,'%',75,85,1],pit:['Pit volume',300,700,'bbl',540,600,0]};
const gPt=(a,r)=>{const t=a*Math.PI/180;return [(100+r*Math.cos(t)).toFixed(2),(100+r*Math.sin(t)).toFixed(2)]};
const gArc=r=>{const [x1,y1]=gPt(150,r),[x2,y2]=gPt(30,r);return `M${x1} ${y1}A${r} ${r} 0 1 1 ${x2} ${y2}`};
function gauge(k,val){const [lab,mn,mx,u,w,c]=GCFG[k];const f=Math.max(0,Math.min(1,(val-mn)/(mx-mn)));const id='gg'+k;
  const ticks=[0,.25,.5,.75,1].map(t=>{const a=150+240*t;const [x1,y1]=gPt(a,70),[x2,y2]=gPt(a,63);const [tx,ty]=gPt(a,52);return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--line2)" stroke-width="1.5"/><text class="gt" x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle">${fmt(mn+(mx-mn)*t,0)}</text>`}).join('');
  const zone=(from,to,col)=>{const a1=150+240*(from-mn)/(mx-mn),a2=150+240*(to-mn)/(mx-mn);const [x1,y1]=gPt(a1,84),[x2,y2]=gPt(a2,84);return `<path d="M${x1} ${y1}A84 84 0 ${a2-a1>180?1:0} 1 ${x2} ${y2}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" opacity=".7"/>`};
  return `<div class="card gauge" data-g="${k}"><svg viewBox="0 0 200 172" role="img" aria-label="${lab}"><defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="#ff9a3d"/><stop offset="1" stop-color="#ff6b00"/></linearGradient><filter id="${id}f" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter></defs>
    <path d="${gArc(76)}" fill="none" stroke="var(--line)" stroke-width="12" stroke-linecap="round"/>${zone(w,c,'var(--warn)')}${zone(c,mx,'var(--crit)')}
    <path class="ga" d="${gArc(76)}" pathLength="100" fill="none" stroke="url(#${id})" stroke-width="12" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="${(100-f*100).toFixed(2)}" filter="url(#${id}f)" opacity=".55"/>
    <path class="ga gm" d="${gArc(76)}" pathLength="100" fill="none" stroke="url(#${id})" stroke-width="12" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="${(100-f*100).toFixed(2)}"/>${ticks}
    <text class="gv" x="100" y="104" text-anchor="middle">${fmt(val,GCFG[k][6])}</text><text class="gu" x="100" y="124" text-anchor="middle">${u}</text></svg><div class="gl">${lab}</div></div>`}
function gaugeSet(root,k,val){const el=root.querySelector(`[data-g="${k}"]`);if(!el)return;const [,mn,mx,,w,c,dp]=GCFG[k];const f=Math.max(0,Math.min(1,(val-mn)/(mx-mn)));
  el.querySelectorAll('.ga').forEach(a=>{a.setAttribute('stroke-dashoffset',(100-f*100).toFixed(2));a.setAttribute('stroke',val>=c?'var(--crit)':val>=w?'var(--warn)':`url(#gg${k})`)});el.querySelector('.gv').textContent=fmt(val,dp);el.classList.toggle('warn',val>=w&&val<c);el.classList.toggle('crit',val>=c)}
const liveSeed=()=>{if(!LIVE.pts.length){for(let i=0;i<60;i++)liveTick();LIVE.alerts=[]}};
PAGES.live=v=>{
  const L=LIVE;liveSeed();
  v.innerHTML=head('Live dashboard','Real-time drilling parameters with threshold alerts and anomaly detection. This view runs on a simulated WITSML feed so you can see how alerts behave.',`<button class="btn" id="lvTog"></button>`)+
  `<p class="note info">Demo data. Connecting a real WITSML server or rig sensor feed needs a backend service, listed on the Roadmap page.</p>
  <div class="row"><span class="eyebrow">Simulate</span><button class="btn sm" data-m="kick">Kick</button><button class="btn sm" data-m="loss">Losses</button><button class="btn sm" data-m="stuck">Stuck pipe</button><button class="btn sm ghost" data-m="">Normal drilling</button><span class="muted" id="lvClock" style="font-size:13px"></span></div>
  <div class="gauges" id="lvG">${['rop','spp','hook','tq'].map(k=>gauge(k,L.pts[L.pts.length-1][k])).join('')}</div><div class="grid g4" id="lvTiles"></div><div class="grid g2"><div class="card"><h3 style="margin-bottom:8px">Pit volume</h3><div id="lvPit"></div></div><div class="card"><h3 style="margin-bottom:8px">Flow out</h3><div id="lvFlow"></div></div><div class="card"><h3 style="margin-bottom:8px">ROP</h3><div id="lvRop"></div></div><div class="card"><h3 style="margin-bottom:8px">Hook load and torque</h3><div id="lvHook"></div></div></div>
  <div class="card stack"><h3>Alert timeline</h3><div class="tl" id="lvAl"></div></div>`;
  const sp=(k)=>{const pts=L.pts.slice(-40);const vals=pts.map(p=>p[k]);const mn=Math.min(...vals),mx=Math.max(...vals)||1;const W=120,H=28;return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="28" preserveAspectRatio="none"><path d="${vals.map((x,i)=>(i?'L':'M')+(i/(vals.length-1)*W).toFixed(1)+' '+(H-2-(x-mn)/((mx-mn)||1)*(H-4)).toFixed(1)).join('')}" fill="none" stroke="var(--accent)" stroke-width="1.6"/></svg>`};
  const paint=()=>{const q=L.pts[L.pts.length-1];const a=CSSV('--accent'),w2=CSSV('--warn');const tenAgo=L.pts[Math.max(0,L.pts.length-11)];const dPit=q.pit-tenAgo.pit;
    const tile=(l,val,u,k,lvl='')=>`<div class="ro ${lvl}"><span class="eyebrow">${l}</span><span class="v">${val}<small>${u}</small></span>${sp(k)}</div>`;
    $('#lvTiles').innerHTML=tile('Bit depth',fmt(q.depth,0),'ft MD','depth')+tile('ROP',fmt(q.rop,1),'ft/hr','rop')+tile('Mud weight',fmt(q.mw,2),'ppg','mw')+tile('Pit volume',fmt(q.pit,1),'bbl · Δ10m '+(dPit>=0?'+':'')+fmt(dPit,1),'pit',dPit>5?'crit':dPit<-5?'warn':'')+tile('Flow out',fmt(q.flow,1),'%','flow')+tile('Hook load',fmt(q.hook,0),'klbf','hook')+tile('Torque',fmt(q.tq,1),'kft·lbf','tq')+tile('Standpipe',fmt(q.spp,0),'psi','spp');
    const pts=L.pts.slice(-100),x0=pts[0].t;const ser=(k,c,n)=>({name:n,color:c,pts:pts.map(p=>[p.t-x0,p[k]]),area:true});
    $('#lvPit').innerHTML=lineChart({series:[ser('pit',a,'Pit')],xLabel:'Minutes',yLabel:'bbl',h:200});$('#lvFlow').innerHTML=lineChart({series:[ser('flow',a,'Flow out')],xLabel:'Minutes',yLabel:'%',h:200});
    $('#lvRop').innerHTML=lineChart({series:[ser('rop',a,'ROP')],xLabel:'Minutes',yLabel:'ft/hr',h:200,ymin:0});$('#lvHook').innerHTML=lineChart({series:[{...ser('hook',a,'Hook load (klbf)'),area:false},{name:'Torque ×10 (kft·lbf)',color:w2,pts:pts.map(p=>[p.t-x0,p.tq*10])}],xLabel:'Minutes',yLabel:'',h:200});
    $('#lvAl').innerHTML=L.alerts.length?L.alerts.map(x=>`<div><span class="pill ${x.lvl}">${x.clock}</span><span><b>${esc(x.msg)}</b><br><span class="muted">Likely cause: ${esc(x.cause)}</span></span></div>`).join(''):'<p class="muted">No alerts. Use the Simulate buttons to trigger one.</p>';
    ['rop','spp','hook','tq'].forEach(k=>gaugeSet(v,k,q[k]));$('#lvClock').textContent='Updated '+new Date().toTimeString().slice(0,8);$('#lvTog').textContent=L.on?'Pause live':'Resume live'};
  v.onclick=e=>{const b=e.target.closest('[data-m]');if(b){L.mode=b.dataset.m||null;L.modeAt=L.pts[L.pts.length-1].t;toast(L.mode?'Simulating '+b.textContent.toLowerCase():'Back to normal drilling')}};
  $('#lvTog').onclick=()=>{L.on=!L.on;paint()};
  const id=setInterval(()=>{if(L.on){liveTick();paint()}},1000);cleanup.push(()=>clearInterval(id));redraw=paint;paint();
};

/* ---------- cost & carbon ---------- */
const CDEF={rig:32000,svc:18000,mat:240000,days:24,foot:10500,diesel:9000,kwh:0,grid:0.4,dfac:2.68,flare:0};
PAGES.cost=v=>{
  let d=Object.assign({},CDEF,store.get(wkey('cost'),{}));const sys=S.sys;const LU=sysUnit('len',sys);
  const F2=[['rig','Rig day rate','USD/day'],['svc','Services per day','USD/day'],['mat','Materials and consumables (total)','USD'],['days','Days on well','days'],['foot','Footage drilled','len'],['diesel','Diesel burned per day','L/day'],['kwh','Grid electricity per day','kWh/day'],['grid','Grid emission factor','kg CO₂e/kWh'],['dfac','Diesel emission factor','kg CO₂e/L'],['flare','Gas flared (total)','t CO₂e']];
  v.innerHTML=head('Cost & carbon','Well cost per foot and CO₂-equivalent emissions from fuel and power. Default factors are typical values; use your company or national factors for reporting.',`<button class="btn pri" id="cExp">Export</button>`)+`<div class="split"><div class="card"><div class="fields">${F2.map(([k,l,u])=>uField('c-'+k,l,u,d[k],sys,`data-k="${k}"`)).join('')}</div></div><div class="stack" id="cres"></div></div>`;
  const calc=()=>{const cost=(d.rig+d.svc)*d.days+d.mat;const co2=(d.diesel*d.dfac+d.kwh*d.grid)*d.days/1000+d.flare;return{cost,cpf:cost/d.foot,co2,perDay:co2/d.days,int:co2*1000/d.foot}};

const GL=[['Annulus','Space between the drill string or casing and the hole wall or outer casing.'],['API','American Petroleum Institute, which publishes equipment and practice standards such as API 6A, 16A and Std 53.'],['BHA','Bottom-hole assembly: bit, motor, MWD, collars, stabilisers and jars below the drill pipe.'],['Blind shear ram','BOP ram that cuts pipe in the hole and seals the open wellbore.'],['BOP','Blowout preventer: the stack of valves that seals the well during a kick.'],['Bottoms up','Pumping until fluid from the bit reaches surface.'],['Buoyancy factor','Fraction of a string’s air weight that remains when immersed in mud.'],['Casing shoe','Bottom of a casing string; often the weakest point exposed during well control.'],['Choke manifold','Valves and chokes that control returns while circulating out a kick.'],['DLS','Dogleg severity: rate of 3D change in wellbore direction, in °/100 ft or °/30 m.'],['Driller’s method','Kill method using two circulations: first to remove the influx, then to pump kill mud.'],['ECD','Equivalent circulating density: effective mud density at depth while pumping.'],['EMW','Equivalent mud weight: a pressure expressed as a mud density at a given depth.'],['FCP','Final circulating pressure, reached when kill mud arrives at the bit.'],['FIT','Formation integrity test: pressure test to a planned limit below leak-off.'],['Flow check','Stopping pumps and watching the well for flow to confirm or rule out a kick.'],['Gas migration','Rise of a gas influx up a shut-in well, increasing surface pressures.'],['HWDP','Heavy-weight drill pipe: transition between collars and drill pipe.'],['ICP','Initial circulating pressure: SCR pressure plus SIDPP.'],['IWCF','International Well Control Forum, which sets well control training and kill sheet formats.'],['Kick','Unplanned flow of formation fluid into the wellbore.'],['Kick tolerance','Largest influx that can be shut in and circulated out without breaking down the shoe.'],['Kill mud weight','Mud density that balances formation pressure.'],['LOT','Leak-off test: pressure test at the shoe to find the fracture gradient.'],['MAASP','Maximum allowable annular surface pressure before shoe breakdown.'],['MPD','Managed pressure drilling: precise control of annular pressure with back-pressure.'],['MSE','Mechanical specific energy: energy used to remove a unit volume of rock.'],['MWD','Measurement while drilling: downhole surveys and data sent to surface.'],['NPT','Non-productive time: hours lost to failures, waiting or unplanned events.'],['Overbalance','Hydrostatic pressure above formation pressure.'],['Pit gain','Increase in active mud volume, a primary kick indicator.'],['PV','Plastic viscosity: mud viscosity from solids and base fluid friction.'],['RKB','Rotary Kelly bushing: the depth reference at the rig floor.'],['ROP','Rate of penetration.'],['SCR','Slow circulating rate: reduced pump rate and pressure recorded for kill operations.'],['SICP','Shut-in casing pressure.'],['SIDPP','Shut-in drill pipe pressure, used to calculate formation pressure.'],['Slug','Small volume of heavy mud pumped so pipe can be pulled dry.'],['Swab','Pressure reduction from pulling pipe, which can draw in formation fluid.'],['Surge','Pressure increase from running pipe, which can break down weak formations.'],['Trip sheet','Record of calculated versus actual hole fill during a trip.'],['TVD','True vertical depth.'],['Wait & Weight','Single-circulation kill method pumping kill mud from the start.'],['WOB','Weight on bit.'],['YP','Yield point: mud’s resistance to start flowing; important for hole cleaning.']];

const BHADEF=()=>({mw:10,bit:10500,wob:25000,ff:0.25,blk:50000,bitTq:3000,dpOd:5,dpTj:6.625,dpWt:21.9,items:[
 {name:'PDC bit 8-1/2"',od:8.5,wt:90,len:1},{name:'Mud motor 6-3/4"',od:6.75,wt:95,len:30},{name:'MWD / LWD',od:6.75,wt:100,len:32},{name:'String stabiliser',od:8.25,wt:100,len:6},

function tdCalc(d,sv){
  const st=minCurv(sv&&sv.length?sv:[{md:0,inc:0,az:0}],0),R=Math.PI/180;
  const at=md=>{if(md<=st[0].md)return st[0];for(let i=1;i<st.length;i++){if(md<=st[i].md){const a=st[i-1],b=st[i],f=(md-a.md)/((b.md-a.md)||1);let da=b.az-a.az;if(da>180)da-=360;if(da<-180)da+=360;return{inc:a.inc+(b.inc-a.inc)*f,az:a.az+da*f}}}return st[st.length-1]};
  const bhaLen=d.items.reduce((a,i)=>a+i.len,0),bhaAir=d.items.reduce((a,i)=>a+i.len*i.wt,0),bf=(65.5-d.mw)/65.5;
  const comp=dist=>{let c=0;for(const i of d.items){c+=i.len;if(dist<=c)return{wt:i.wt,od:i.od}}return{wt:d.dpWt,od:d.dpTj}};
  const run=(sgn,rot,T0)=>{let T=T0,tq=0,np=null;const prof=[[d.bit,T]];const step=50;
    for(let md2=d.bit;md2>0;md2-=step){const md1=Math.max(0,md2-step),L=md2-md1,mid=(md1+md2)/2,c=comp(d.bit-mid),w=c.wt*bf*L;const p2=at(md2),p1=at(md1);const Im=(p1.inc+p2.inc)/2*R,dI=(p1.inc-p2.inc)*R;let dA=p1.az-p2.az;if(dA>180)dA-=360;if(dA<-180)dA+=360;dA*=R;
      const N=Math.hypot(T*dA*Math.sin(Im),T*dI+w*Math.sin(Im));const Tn=T+w*Math.cos(Im)+(rot?0:sgn*d.ff*N);if(rot)tq+=d.ff*N*(c.od/2/12);if(np===null&&T<0&&Tn>=0)np=d.bit-md2+L*(-T/((Tn-T)||1));T=Tn;prof.push([md1,T])}
    return{T,tq,prof,np}};
  const pu=run(1,false,0),so=run(-1,false,0),rt=run(0,true,0),dr=run(0,true,-d.wob);
  const incl=Math.max(...st.map(s=>s.inc));
  return{bhaLen,bhaAir,bhaB:bhaAir*bf,bf,pu,so,rt,dr,incl,dpLen:Math.max(0,d.bit-bhaLen),wobMax:bhaAir*bf*0.85*Math.cos(at(d.bit).inc*R)};
}

function cemCalc(d){const capOH=(d.hole*d.hole-d.od*d.od)/1029.4,capC=(d.prevId*d.prevId-d.od*d.od)/1029.4,capI=d.id*d.id/1029.4;
  const ann=(a,b)=>{const oh=Math.max(0,b-Math.max(a,d.prevShoe)),cs=Math.max(0,Math.min(b,d.prevShoe)-a);return oh*capOH*(1+d.ex/100)+cs*capC};
  const r={};r.shoeTrack=capI*(d.shoe-d.fc);r.tail=ann(d.topTail,d.shoe)+r.shoeTrack;r.lead=ann(d.tocLead,d.topTail);
  r.tailSx=r.tail*5.6146/d.tailY;r.leadSx=r.lead*5.6146/d.leadY;r.tailWtr=r.tailSx*d.tailWtr/42;r.leadWtr=r.leadSx*d.leadWtr/42;

  let t=0;r.sched.forEach(s=>{t+=s.min;s.cum=t});r.time=t;
  r.pAnn=0.052*(d.mw*d.tocLead+d.leadW*(d.topTail-d.tocLead)+d.tailW*(d.shoe-d.topTail));r.pIn=0.052*(d.dispW*d.fc+d.tailW*(d.shoe-d.fc));r.diff=r.pAnn-r.pIn;r.emw=r.pAnn/(0.052*d.shoe);return r}

const GRADES={'H-40':40,'J-55':55,'K-55':55,'N-80':80,'L-80':80,'C-90':90,'T-95':95,'P-110':110,'Q-125':125};
function collapseAPI(D,t,Yk){const Y=Yk*1000,dt=D/t;const A=2.8762+0.10679e-5*Y+0.21301e-10*Y*Y-0.53132e-16*Y*Y*Y,B=0.026233+0.50609e-6*Y,C=-465.93+0.030867*Y-0.10483e-7*Y*Y+0.36989e-13*Y*Y*Y;
  const ba=B/A,x=3*ba/(2+ba);const F=46.95e6*Math.pow(x,3)/(Y*(x-ba)*Math.pow(1-x,2)),G=F*B/A;
  const yp=(Math.sqrt(Math.pow(A-2,2)+8*(B+C/Y))+(A-2))/(2*(B+C/Y)),pt=Y*(A-F)/(C+Y*(B-G)),te=(2+ba)/(3*ba);
  if(dt<=yp)return{p:2*Y*((dt-1)/(dt*dt)),mode:'Yield'};if(dt<=pt)return{p:Y*(A/dt-B)-C,mode:'Plastic'};if(dt<=te)return{p:Y*(F/dt-G),mode:'Transition'};return{p:46.95e6/(dt*Math.pow(dt-1,2)),mode:'Elastic'}}
const CSDEF={od:9.625,id:8.681,wt:47,grade:'N-80',depth:8000,mwOut:10,nextTd:12000,ppNext:12.5,gg:0.1,backup:0.465,evac:100,over:100000,dfB:1.1,dfC:1.125,dfT:1.6};
function csgCalc(d){const Y=GRADES[d.grade]||80,t=(d.od-d.id)/2;const r={t,Y};
  r.burst=0.875*2*Y*1000*t/d.od;r.col=collapseAPI(d.od,t,Y);r.ten=Y*1000*0.7854*(d.od*d.od-d.id*d.id);
  const pf=d.ppNext*0.052*d.nextTd;r.bSurf=pf-d.gg*d.nextTd;r.bShoe=r.bSurf+d.gg*d.depth-d.backup*d.depth;r.bLoad=Math.max(r.bSurf,r.bShoe);
  r.cLoad=d.mwOut*0.052*d.depth*d.evac/100;const bf=(65.5-d.mwOut)/65.5;r.tLoad=d.wt*d.depth*bf+d.over;
  r.sfB=r.burst/r.bLoad;r.sfC=r.col.p/r.cLoad;r.sfT=r.ten/r.tLoad;return r}

const HYDEF={mw:10,pv:18,yp:16,q:500,tvd:10000,md:10500,hole:8.5,csgId:8.681,shoe:5100,dpId:4.276,dpOd:5,hwId:3,hwLen:500,dcId:2.8125,dcOd:6.5,dcLen:600,surf:100,n1:12,n2:12,n3:12,n4:12,n5:0,pmax:4000};
function hydCalc(d){const pipe=(id,L)=>{const vel=d.q/(2.448*id*id);const lam=(d.pv*vel/(1500*id*id)+d.yp/(225*id))*L,tur=Math.pow(d.mw,.75)*Math.pow(vel,1.75)*Math.pow(d.pv,.25)/(1800*Math.pow(id,1.25))*L;return{dp:Math.max(lam,tur),reg:tur>lam?'Turbulent':'Laminar',vel:vel*60}};
  const ann=(d2,d1,L)=>{const vel=d.q/(2.448*(d2*d2-d1*d1)),de=d2-d1;const lam=(d.pv*vel/(1000*de*de)+d.yp/(200*de))*L,tur=Math.pow(d.mw,.75)*Math.pow(vel,1.75)*Math.pow(d.pv,.25)/(1396*Math.pow(de,1.25))*L;return{dp:Math.max(lam,tur),reg:tur>lam?'Turbulent':'Laminar',vel:vel*60}};
  const dpLen=Math.max(0,d.md-d.hwLen-d.dcLen),oh=Math.max(0,d.md-d.shoe);const dcOH=Math.min(d.dcLen,oh),hwOH=Math.min(d.hwLen,oh-dcOH),dpOH=Math.max(0,oh-dcOH-hwOH);
  const S1=[['Surface equipment','',0,{dp:d.surf,reg:'—',vel:NaN}],['Drill pipe bore','pipe',dpLen,pipe(d.dpId,dpLen)],['HWDP bore','pipe',d.hwLen,pipe(d.hwId,d.hwLen)],['Drill collar bore','pipe',d.dcLen,pipe(d.dcId,d.dcLen)]];
  const A1=[['Collars × open hole','ann',dcOH,ann(d.hole,d.dcOd,dcOH)],['HWDP × open hole','ann',hwOH,ann(d.hole,d.dpOd,hwOH)],['Drill pipe × open hole','ann',dpOH,ann(d.hole,d.dpOd,dpOH)],['Drill pipe × casing','ann',d.shoe,ann(d.csgId,d.dpOd,d.shoe)]];
  const r={S1,A1};r.tfa=[d.n1,d.n2,d.n3,d.n4,d.n5].reduce((a,n)=>a+n*n,0)/1303.8;r.pbit=d.mw*d.q*d.q/(12031*r.tfa*r.tfa);
  r.pStr=S1.reduce((a,s)=>a+s[3].dp,0);r.pAnn=A1.reduce((a,s)=>a+s[3].dp,0);r.spp=r.pStr+r.pAnn+r.pbit;r.ecd=d.mw+r.pAnn/(0.052*d.tvd);

  const avail=d.pmax-r.pStr-r.pAnn;r.tfaOpt=avail>0?Math.sqrt(d.mw*d.q*d.q/(12031*avail)):NaN;r.avMin=Math.min(...A1.filter(a=>a[2]>0).map(a=>a[3].vel));return r}

/* ================= 5. Pore pressure and fracture gradient ================= */
const PPDEF=()=>({obg:1.0,pn:0.465,nu:0.4,ki:0.7,method:'dexp',margin:0.5,rows:[[4000,1.40,1.40],[6000,1.55,1.55],[8000,1.50,1.70],[9000,1.35,1.78],[10000,1.25,1.85],[11000,1.20,1.92]]});
function ppCalc(d){const n=d.method==='sonic'?3:1.2;return d.rows.filter(r=>r.every(Number.isFinite)).sort((a,b)=>a[0]-b[0]).map(([tvd,obs,nor])=>{const ratio=d.method==='sonic'?nor/obs:obs/nor;const pp=d.obg-(d.obg-d.pn)*Math.pow(ratio,n);const fe=d.nu/(1-d.nu)*(d.obg-pp)+pp,fm=pp+d.ki*(d.obg-pp);return{tvd,pp:pp/0.052,fe:fe/0.052,fm:fm/0.052,mw:pp/0.052+d.margin}})}
PAGES.ppfg=v=>{
  let d=store.get(wkey('ppfg'),null)||PPDEF();const sys=S.sys,key=wkey('ppfg');
  const F1=[['obg','Overburden gradient','grad'],['pn','Normal pore gradient','grad'],['nu','Poisson’s ratio (Eaton)','–'],['ki','Matrix stress coefficient Ki (Matthews & Kelly)','–'],['margin','Trip margin above pore pressure','dens']];
  v.innerHTML=head('Pore pressure and fracture gradient','Eaton pore pressure from a d-exponent, resistivity or sonic trend, with Eaton and Matthews & Kelly fracture gradients. The chart shows the mud weight window.',`<button class="btn pri" id="xExp">Export</button>`)+
  `<div class="split"><div class="stack"><div class="card stack"><label class="fld"><span>Trend data type</span><select id="ppM"><option value="dexp"${d.method==='dexp'?' selected':''}>d-exponent or resistivity (Eaton exponent 1.2)</option><option value="sonic"${d.method==='sonic'?' selected':''}>Sonic transit time (Eaton exponent 3.0)</option></select></label><div class="fields">${flds('pp-',F1,d,sys)}</div></div>
  <div class="tbl"><table><thead><tr><th>TVD (ft)</th><th>Observed</th><th>Normal trend</th><th class="n">Pore (ppg)</th><th class="n">Frac Eaton</th><th class="n">Frac M&K</th><th></th></tr></thead><tbody id="pprw"></tbody></table></div><div class="row"><button class="btn" id="ppAdd">Add depth</button></div></div>
  <div class="card"><h3 style="margin-bottom:8px">Mud weight window</h3><div id="ppch"></div></div></div>`;
  const rows=()=>{$('#pprw').innerHTML=d.rows.map((r,i)=>`<tr data-i="${i}">${[0,1,2].map(c=>`<td><input type="number" step="any" data-c="${c}" value="${fmtIn(r[c])}" style="width:92px"></td>`).join('')}<td class="n"></td><td class="n"></td><td class="n"></td><td><button class="btn sm ghost danger" data-del="${i}" aria-label="Delete">✕</button></td></tr>`).join('');calc()};
  const calc=()=>{const r=ppCalc(d);d.rows.forEach((row,i)=>{const m=r.find(x=>x.tvd===row[0]),tr=$(`#pprw tr[data-i="${i}"]`);if(!tr)return;tr.children[3].textContent=m?fmt(m.pp,2):'—';tr.children[4].textContent=m?fmt(m.fe,2):'—';tr.children[5].textContent=m?fmt(m.fm,2):'—';tr.className=m&&m.pp>d.pn/0.052+0.5?'warn':''});
    $('#ppch').innerHTML=r.length>1?lineChart({series:[{name:'Pore pressure',color:CSSV('--crit'),pts:r.map(x=>[x.pp,x.tvd]),dots:true,end:false},{name:'Mud weight',color:CSSV('--accent'),pts:r.map(x=>[x.mw,x.tvd]),dash:true,end:false},{name:'Fracture (Eaton)',color:CSSV('--ok'),pts:r.map(x=>[x.fe,x.tvd]),dots:true,end:false}],xLabel:'Equivalent mud weight (ppg)',yLabel:'TVD (ft)',yInvert:true,h:420,w:520}):'<p class="muted">Add at least two depths.</p>'};
  bindForm(v,d,sys,key,calc);const base=v.oninput;
  v.oninput=v.onchange=e=>{if(e.target.id==='ppM'){d.method=e.target.value;store.set(key,d);calc();return}const tr=e.target.closest('tr[data-i]');if(!tr)return base(e);d.rows[+tr.dataset.i][+e.target.dataset.c]=num(e.target.value);store.set(key,d);calc()};
  v.onclick=e=>{const b=e.target.closest('[data-del]');if(b){d.rows.splice(+b.dataset.del,1);store.set(key,d);rows()}};
  $('#ppAdd').onclick=()=>{const l=d.rows[d.rows.length-1]||[0,1,1];d.rows.push([l[0]+1000,l[1],l[2]]);store.set(key,d);rows()};
  $('#xExp').onclick=()=>exportDialog({title:'Pore pressure and fracture gradient',file:'PPFG',build:()=>({title:'Pore pressure and fracture gradient',file:'PPFG',meta:[['Method',d.method==='sonic'?'Eaton sonic (n=3)':'Eaton d-exponent/resistivity (n=1.2)'],['Overburden gradient',d.obg+' psi/ft'],['Normal gradient',d.pn+' psi/ft']],tables:[{title:'Results (ppg EMW)',head:['TVD ft','Pore pressure','Frac Eaton','Frac M&K','Suggested MW'],body:ppCalc(d).map(x=>[x.tvd,fmt(x.pp,2),fmt(x.fe,2),fmt(x.fm,2),fmt(x.mw,2)])}]})});
  redraw=calc;rows();
};

/* ================= 6. Stuck pipe and fishing decision guide ================= */
const STK={
 pack:{t:'Pack-off or bridge',why:'Circulation is restricted or lost. Cuttings, cavings or junk have packed around the string.',act:['Cut pump rate to idle at once. Do not try to force circulation; trapped pressure makes the pack-off tighter.','Bleed standpipe pressure to about 200–500 psi and hold it so you can see any return of circulation.','Work the string in the direction opposite to the movement before sticking. If you were pulling out, apply torque and slack off or jar down.','Do not jar up if the pipe stuck while moving up.','When circulation returns, raise the pump rate in small steps and circulate the hole clean before moving on.']},
 diff:{t:'Differential sticking',why:'The pipe was static across a permeable zone with overbalance and circulation is still free.',act:['Act immediately; the sticking force grows with time.','Circulate at the maximum allowable rate to erode filter cake.','Apply maximum torque and slack off; jar down with maximum load. Work torque down to the stuck point.','Prepare and spot a pipe-release pill across the stuck zone and let it soak, working the pipe from time to time.','If well control allows, consider reducing hydrostatic pressure (lower mud weight or U-tube) with supervisor approval.']},
 geo:{t:'Wellbore geometry',why:'The pipe stuck while moving with free circulation: key seat, ledge, undergauge hole, stiff assembly or a dogleg.',act:['Jar in the direction opposite to the movement before sticking, starting with light loads.','If stuck moving up, apply torque and jar down. If stuck moving down, jar up without torque.','Keep circulating at a reduced rate while working the pipe.','Once free, ream and back-ream the tight interval before tripping through it again.','Review the BHA stiffness and dogleg severity before the next run.']}};
const SQ=[{id:'circ',q:'Can you circulate?',o:[['free','Yes, at normal pressure'],['restricted','Restricted or pressure is high'],['none','No circulation']]},
 {id:'move',q:'What was the pipe doing just before it stuck?',o:[['static','Static (connection, survey, repair)'],['up','Moving up or back-reaming'],['down','Moving down or reaming']]},
 {id:'rot',q:'Can you rotate?',o:[['free','Yes'],['restricted','With high torque'],['none','No']]},
 {id:'zone',q:'Is the BHA across a permeable zone with overbalance?',o:[['yes','Yes'],['no','No or not known']]}];
function stuckDiag(a){const s={pack:0,diff:0,geo:0};
  if(a.circ==='none')s.pack+=3;if(a.circ==='restricted')s.pack+=2;if(a.circ==='free'){s.diff+=1;s.geo+=1}
  if(a.move==='static'){s.diff+=2}else if(a.move){s.geo+=2;s.pack+=1}
  if(a.rot==='none'){s.diff+=1;s.pack+=1}if(a.rot==='free')s.geo+=1;
  if(a.zone==='yes')s.diff+=2;return s}

    <div class="stack">${done?`<div class="card stack"><div class="eyebrow">Most likely mechanism</div><h2>${STK[best].t}</h2><p class="muted">${STK[best].why}</p>${bars([{label:'Pack-off or bridge',v:s.pack,dp:0},{label:'Differential',v:s.diff,dp:0},{label:'Wellbore geometry',v:s.geo,dp:0}],'pts')}<h3>First actions</h3><ol class="steps">${STK[best].act.map(x=>`<li>${x}</li>`).join('')}</ol></div>`:'<div class="card"><h3>Answer all four questions</h3><p class="muted" style="margin-top:6px">The likely mechanism and first actions appear here.</p></div>'}
    <p class="note">This guide supports the driller’s judgement. Follow your company stuck pipe procedure and tell the supervisor at once.</p></div></div>
    <div class="grid g3"><div class="card stack"><h3>Free point from stretch</h3><div class="fields">${flds('sk-',[['e','Stretch','dia'],['w','Pipe weight','wpl'],['p','Differential pull','force']],d,sys)}</div><div id="sk1"></div></div>
    <div class="card stack"><h3>Spotting pill volume</h3><div class="fields">${flds('sk-',[['len','Zone length','len'],['hole','Hole diameter','dia'],['od','Pipe OD at zone','dia'],['ex','Excess','%']],d,sys)}</div><div id="sk2"></div></div>
    <div class="card stack"><h3>Fishing economics</h3><div class="fields">${flds('sk-',[['fishVal','Value of fish','USD'],['stCost','Sidetrack cost','USD'],['dayCost','Daily fishing cost','USD/day']],d,sys)}</div><div id="sk3"></div></div></div>`;
    const calc=()=>{$('#sk1').innerHTML=`<div class="readouts">${ro('Free pipe length',DN('len',735294*d.e*d.w/d.p,sys,0),sysUnit('len',sys),'key')}</div>`;$('#sk2').innerHTML=`<div class="readouts">${ro('Pill volume',DN('vol',(d.hole*d.hole-d.od*d.od)/1029.4*d.len*(1+d.ex/100),sys,1),sysUnit('vol',sys),'key')}</div>`;$('#sk3').innerHTML=`<div class="readouts">${ro('Economic fishing time',fmt((d.fishVal+d.stCost)/d.dayCost,1),'days','key','Past this, sidetracking costs less')}</div>`};
    bindForm(v,d,sys,wkey('stuckc'),calc);calc();

/* ================= 8. Well control trainer ================= */
const MCQ=[['What is the first action when a primary kick indicator is seen while drilling?',['Increase mud weight','Flow check, then shut in if the well flows','Call the mud engineer','Speed up the pumps'],1],
 ['SIDPP is used to calculate:',['Kill mud weight','Influx volume','MAASP','Annular velocity'],0],
 ['In the Wait & Weight method, drill pipe pressure falls from ICP to FCP while:',['Kill mud travels from surface to the bit','Kill mud travels from the bit to surface','The influx passes the shoe','The pumps are stopped'],0],
 ['The Driller’s method uses how many circulations?',['One','Two','Three','It depends on kick size'],1],
 ['MAASP is limited by:',['Pump liner rating','Formation strength at the casing shoe','Annular preventer rating only','Drill pipe burst'],1],
 ['Gas migrating up a shut-in well without expansion will:',['Reduce bottom-hole pressure','Raise surface and bottom-hole pressures','Have no effect','Reduce SICP'],1],
 ['Which reading is normally higher after shutting in on a gas kick?',['SIDPP','SICP','They are always equal','Neither'],1],
 ['Slow circulating rate pressures should be retaken when:',['Mud properties or depth change significantly','Only at the start of the well','Only after a kick','Never'],0],
 ['Pulling pipe too fast can cause:',['Surge','Swabbing','Lost circulation','Higher ECD'],1],
 ['During a kill, bottom-hole pressure is kept constant by:',['Changing pump speed','Adjusting the choke','Adding barite','Rotating the pipe'],1],
 ['Final circulating pressure equals:',['SCR pressure × kill mud weight ÷ original mud weight','SCR pressure + SIDPP','SIDPP × kill mud weight','SICP − SIDPP'],0],
 ['A drilling break followed by increased return flow suggests:',['Bit balling','A possible kick','Washout','Lost circulation'],1]];
function genScenario(){const rnd=(a,b,s)=>Math.round((a+Math.random()*(b-a))/s)*s;const tvd=rnd(7000,13000,100),mw=rnd(9.5,13,0.1),sidpp=rnd(250,800,10),scr=rnd(400,900,10),shoe=rnd(3000,tvd-2500,100),lot=+(mw+rnd(2.5,4.5,0.1)).toFixed(1);const kmw=mw+sidpp/(0.052*tvd);const kr=Math.ceil(kmw*10-1e-9)/10;
  return{tvd,mw:+mw.toFixed(1),sidpp,scr,shoe,lot,q:[['Formation pressure','psi',sidpp+0.052*mw*tvd,15],['Kill mud weight (round up to 0.1)','ppg',kr,0.051],['Initial circulating pressure','psi',scr+sidpp,5],['Final circulating pressure (use rounded kill mud)','psi',scr*kr/mw,10],['MAASP with current mud','psi',(lot-mw)*0.052*shoe,15]]}}
PAGES.trainer=v=>{
  let sc=genScenario(),checked=false;const best=store.get('trainbest',{calc:0,mcq:0});let pick=[],ans={};
  const newQ=()=>{pick=[...MCQ.keys()].sort(()=>Math.random()-.5).slice(0,6);ans={}};newQ();
  const draw=()=>{
    v.innerHTML=head('Well control trainer','Practice IWCF-style kill sheet calculations on a new random scenario each time, then test your knowledge with quick questions. Nothing here is connected to a real well.')+
    `<div class="split"><div class="card stack"><div class="row" style="justify-content:space-between"><h3>Kill sheet scenario</h3><span class="pill info">Best ${best.calc}/5</span></div>
    <dl class="kv"><dt>True vertical depth</dt><dd>${fmt(sc.tvd,0)} ft</dd><dt>Mud weight</dt><dd>${sc.mw} ppg</dd><dt>SIDPP</dt><dd>${sc.sidpp} psi</dd><dt>SCR pressure</dt><dd>${sc.scr} psi</dd><dt>Casing shoe TVD</dt><dd>${fmt(sc.shoe,0)} ft</dd><dt>LOT EMW at shoe</dt><dd>${sc.lot} ppg</dd></dl>
    ${sc.q.map((q,i)=>`<label class="fld"><span>${q[0]}</span><div class="inrow"><input type="number" step="any" inputmode="decimal" id="tr-${i}"><span class="u">${q[1]}</span></div><span class="trres" id="trr-${i}"></span></label>`).join('')}
    <div class="row"><button class="btn pri" id="trC">Check answers</button><button class="btn" id="trN">New scenario</button></div><div id="trS"></div></div>
    <div class="card stack"><div class="row" style="justify-content:space-between"><h3>Quick questions</h3><span class="pill info">Best ${best.mcq}/6</span></div>${pick.map((qi,n)=>`<div class="stack" style="gap:6px"><b>${n+1}. ${MCQ[qi][0]}</b>${MCQ[qi][1].map((o,k)=>{const sel=ans[n]===k,show=ans[n]!=null,right=k===MCQ[qi][2];return `<button class="chip mcq ${show&&right?'ok':''} ${show&&sel&&!right?'bad':''}" data-n="${n}" data-k="${k}" aria-pressed="${sel}" ${show?'disabled':''}>${o}</button>`}).join('')}</div>`).join('')}<div class="row"><button class="btn" id="trM">New questions</button><span class="muted" id="trMs"></span></div></div></div>`;
    const sc2=Object.keys(ans).filter(n=>ans[n]===MCQ[pick[n]][2]).length;if(Object.keys(ans).length===pick.length){$('#trMs').textContent=`Score ${sc2} / ${pick.length}`;if(sc2>best.mcq){best.mcq=sc2;store.set('trainbest',best)}}
    $('#trC').onclick=()=>{let ok=0;sc.q.forEach((q,i)=>{const x=num($('#tr-'+i).value);const good=Number.isFinite(x)&&Math.abs(x-q[2])<=q[3];if(good)ok++;$('#trr-'+i).innerHTML=`<span class="pill ${good?'ok':'crit'}">${good?'Correct':'Answer '+fmt(q[2],q[1]==='ppg'?1:0)+' '+q[1]}</span>`});$('#trS').innerHTML=`<div class="note ${ok===5?'info':''}">Score ${ok} / 5. ${ok===5?'All correct.':'Open the Kill sheet or Formulas page to review the working.'}</div>`;if(ok>best.calc){best.calc=ok;store.set('trainbest',best)}};
    $('#trN').onclick=()=>{sc=genScenario();draw()};$('#trM').onclick=()=>{newQ();draw()};
  };
  v.onclick=e=>{const b=e.target.closest('.mcq');if(b&&!b.disabled){ans[+b.dataset.n]=+b.dataset.k;const vals=sc.q.map((_,i)=>$('#tr-'+i).value);draw();vals.forEach((x,i)=>$('#tr-'+i).value=x)}};
  draw();
};

/* ================= PVT calculator ================= */
const PVDEF={p:3000,t:200,sg:0.65,api:35};
function pvtCalc(d){const T=d.t+459.67,Tpc=168+325*d.sg-12.5*d.sg*d.sg,Ppc=677+15*d.sg-37.5*d.sg*d.sg,Tr=T/Tpc,Pr=d.p/Ppc;
  const z=1-3.52*Pr/Math.pow(10,0.9813*Tr)+0.274*Pr*Pr/Math.pow(10,0.8157*Tr);const bg=0.02827*z*T/d.p,rho=2.7*d.sg*d.p/(z*T);
  const go=141.5/(131.5+d.api),rs=d.sg*Math.pow((d.p/18.2+1.4)*Math.pow(10,0.0125*d.api-0.00091*d.t),1.2048),bo=0.9759+0.00012*Math.pow(rs*Math.sqrt(d.sg/go)+1.25*d.t,1.2);
  return{Tpc,Ppc,Tr,Pr,z,bg,rho,go,rs,bo}}
PAGES.pvt=v=>{
  let d=Object.assign({},PVDEF,store.get(wkey('pvt'),{}));const sys=S.sys;
  v.innerHTML=head('PVT calculator','Gas Z-factor, formation volume factor and density, with Standing’s solution gas-oil ratio and oil volume factor at the same pressure and temperature.')+
  `<div class="split"><div class="card"><div class="fields">${flds('pv-',[['p','Pressure','pres'],['t','Temperature','temp'],['sg','Gas specific gravity (air = 1)','–'],['api','Oil gravity','°API']],d,sys)}</div></div><div class="stack" id="pvres"></div></div>`;
  const calc=()=>{const r=pvtCalc(d);const bad=r.Tr<1.2||r.Tr>3||r.Pr>15||!(r.z>0);
    $('#pvres').innerHTML=`${bad?'<div class="note">These conditions are outside the range where the Papay Z-factor correlation is reliable (reduced temperature 1.2–3.0). Treat the gas results as rough.</div>':''}
    <div class="readouts">${ro('Z-factor',fmt(r.z,3),'','key')}${ro('Gas FVF (Bg)',fmt(r.bg,5),'ft³/scf','key')}${ro('Gas density',fmt(r.rho,2),'lb/ft³','',fmt(r.rho/7.4805,2)+' ppg')}${ro('Gas gradient',fmt(r.rho/144,3),'psi/ft')}${ro('Solution GOR (Rs)',fmt(r.rs,0),'scf/stb')}${ro('Oil FVF (Bo)',fmt(r.bo,3),'rb/stb')}</div>
    <div class="card"><dl class="kv"><dt>Pseudo-critical temperature</dt><dd>${fmt(r.Tpc,1)} °R</dd><dt>Pseudo-critical pressure</dt><dd>${fmt(r.Ppc,1)} psia</dd><dt>Reduced temperature</dt><dd>${fmt(r.Tr,3)}</dd><dt>Reduced pressure</dt><dd>${fmt(r.Pr,3)}</dd><dt>Oil specific gravity</dt><dd>${fmt(r.go,3)}</dd></dl></div>
    <p class="muted" style="font-size:12.5px">Correlations: Standing pseudo-critical properties, Papay Z-factor, Standing Rs and Bo at saturation. For sweet natural gas and black oil; sour gas and condensates need laboratory PVT.</p>`};
  bindForm(v,d,sys,wkey('pvt'),calc);calc();
};

/* ================= Surge and swab ================= */
const SGDEF={mw:10,pv:18,yp:16,hole:8.5,od:5,id:4.276,bit:10000,tvd:10000,stand:93,sec:60,pore:9.4,frac:14.5,mode:'closed'};
function surgeP(d,vp){ // vp pipe speed ft/min -> pressure psi
  if(!(vp>0))return{p:0,va:0,reg:'—'};const ann=d.hole*d.hole-d.od*d.od;
  const k=d.mode==='open'?0.45+(d.od*d.od-d.id*d.id)/(ann+d.id*d.id):0.45+d.od*d.od/ann;
  const va=vp*k,vm=1.5*va/60,de=d.hole-d.od;
  const lam=(d.pv*vm/(1000*de*de)+d.yp/(200*de))*d.bit,tur=Math.pow(d.mw,.75)*Math.pow(vm,1.75)*Math.pow(d.pv,.25)/(1396*Math.pow(de,1.25))*d.bit;
  return{p:Math.max(lam,tur),va,reg:tur>lam?'Turbulent':'Laminar'}}
function surgeCalc(d){const vp=d.stand/(d.sec/60),r=surgeP(d,vp),g=0.052*d.tvd;const res={vp,...r,surge:d.mw+r.p/g,swab:d.mw-r.p/g};
  const maxV=lim=>{if(!(lim>0))return 0;if(surgeP(d,0.01).p>lim)return 0;let lo=0.01,hi=2000;if(surgeP(d,hi).p<=lim)return hi;for(let i=0;i<50;i++){const m=(lo+hi)/2;surgeP(d,m).p<=lim?lo=m:hi=m}return lo};
  res.vOut=maxV((d.mw-d.pore)*g);res.vIn=maxV((d.frac-d.mw)*g);return res}

    <div class="readouts">${ro('Surge / swab pressure',DN('pres',r.p,sys,0),sysUnit('pres',sys),'key',r.reg+' flow')}${ro('EMW pulling out (swab)',DN('dens',r.swab,sys,2),du,sw?'crit':'')}${ro('EMW running in (surge)',DN('dens',r.surge,sys,2),du,su?'crit':'')}${ro('Pipe speed',fmt(r.vp,0),'ft/min','',fmt(r.va,0)+' ft/min mud velocity')}</div>
    <div class="card"><h3 style="margin-bottom:10px">Maximum safe tripping speed</h3><dl class="kv"><dt>Pulling out (stay above pore pressure)</dt><dd>${lim(r.vOut)}</dd><dt>Running in (stay below fracture)</dt><dd>${lim(r.vIn)}</dd><dt>Swab margin available</dt><dd>${DV('dens',d.mw-d.pore,sys,2)}</dd><dt>Surge margin available</dt><dd>${DV('dens',d.frac-d.mw,sys,2)}</dd></dl></div>

/* ================= BHA and torque & drag, version 2 ================= */
function tdCalc2(d,sv,opt={}){
  const ff=opt.ff??d.ff,bit=opt.bit??d.bit,R=Math.PI/180,sag=d.sag||0;
  const st=minCurv(sv&&sv.length?sv:[{md:0,inc:0,az:0}],0).map(s=>({...s,inc:s.inc+sag*Math.sin(s.inc*R)}));
  const at=md=>{if(md<=st[0].md)return st[0];for(let i=1;i<st.length;i++){if(md<=st[i].md){const a=st[i-1],b=st[i],f=(md-a.md)/((b.md-a.md)||1);let da=b.az-a.az;if(da>180)da-=360;if(da<-180)da+=360;return{inc:a.inc+(b.inc-a.inc)*f,az:a.az+da*f}}}return st[st.length-1]};
  const bhaLen=d.items.reduce((a,i)=>a+i.len,0),bhaAir=d.items.reduce((a,i)=>a+i.len*i.wt,0),bf=(65.5-d.mw)/65.5;
  const comp=dist=>{let c=0;for(const i of d.items){c+=i.len;if(dist<=c)return{wt:i.wt,od:i.od,body:i.od,id:i.od*0.43}}return{wt:d.dpWt,od:d.dpTj,body:d.dpOd,id:d.dpId||d.dpOd*0.855}};
  const run=(sgn,rot,T0)=>{let T=T0,tq=0,np=null;const prof=[[bit,T]],el=[];const step=50;
    for(let md2=bit;md2>0;md2-=step){const md1=Math.max(0,md2-step),L=md2-md1,mid=(md1+md2)/2,c=comp(bit-mid),w=c.wt*bf*L;const p2=at(md2),p1=at(md1);const Im=(p1.inc+p2.inc)/2*R,dI=(p1.inc-p2.inc)*R;let dA=p1.az-p2.az;if(dA>180)dA-=360;if(dA<-180)dA+=360;dA*=R;
      const N=Math.hypot(T*dA*Math.sin(Im),T*dI+w*Math.sin(Im));const Tn=T+w*Math.cos(Im)+(rot?0:sgn*ff*N);if(rot)tq+=ff*N*(c.od/2/12);if(np===null&&T<0&&Tn>=0)np=bit-md2+L*(-T/((Tn-T)||1));
      el.push({md1,md2,T:Math.min(T,Tn),inc:Im,c});T=Tn;prof.push([md1,T])}
    return{T,tq,prof,np,el}};
  const buck=r=>{const out=[];let worst=Infinity;r.el.forEach(e=>{if(e.T>=0)return;const F=-e.T,D=e.c.body,I=Math.PI/64*(Math.pow(D,4)-Math.pow(e.c.id,4)),w=e.c.wt*bf/12,rc=(d.hole-D)/2,E=30e6;if(!(rc>0))return;
      let Fs,Fh;if(Math.sin(e.inc)>0.05){Fs=2*Math.sqrt(E*I*w*Math.sin(e.inc)/rc);Fh=Math.SQRT2*Fs}else{Fs=1.94*Math.cbrt(E*I*w*w);Fh=5.55*Math.cbrt(E*I*w*w)}
      worst=Math.min(worst,Fs/F);const stt=F>Fh?'Helical':F>Fs?'Sinusoidal':null;if(!stt)return;const l=out[out.length-1];if(l&&l.state===stt&&Math.abs(l.top-e.md2)<1){l.top=e.md1;l.F=Math.max(l.F,F)}else out.push({top:e.md1,bot:e.md2,state:stt,F,Fs,Fh})});return{list:out,worst}};
  if(opt.light){return{pu:run(1,false,0).T,so:run(-1,false,0).T,rt:run(0,true,0).T,bhaLen}}
  const pu=run(1,false,0),so=run(-1,false,0),rt=run(0,true,0),dr=run(0,true,-d.wob),sl=run(-1,false,-d.wob);
  return{bhaLen,bhaAir,bhaB:bhaAir*bf,bf,pu,so,rt,dr,sl,incl:Math.max(...st.map(s=>s.inc)),wobMax:bhaAir*bf*0.85*Math.cos(at(bit).inc*R),bkSlide:buck(sl),bkRot:buck(dr)}}
function tdCal(d,sv,target,sgn){ // back-calculate friction factor for a measured hook load

  const cyl=(z0,z1,r,col,n=28)=>{for(let i=0;i<n;i++){const a0=i/n*6.2832,a1=(i+1)/n*6.2832,am=(a0+a1)/2;quad([[r*Math.cos(a0),r*Math.sin(a0),z0],[r*Math.cos(a1),r*Math.sin(a1),z0],[r*Math.cos(a1),r*Math.sin(a1),z1],[r*Math.cos(a0),r*Math.sin(a0),z1]],[Math.cos(am),Math.sin(am),0],col)}
    const top=[];for(let i=0;i<n;i++){const a=i/n*6.2832;top.push([r*Math.cos(a),r*Math.sin(a),z1])}quad(top,[0,0,1],col)};

    else if(r.type==='Ram'){cyl(z0,z1,1.5,steel);const hh=r.h*0.3;boxm(-3.6,-1.3,-0.75,0.75,zm-hh,zm+hh,acc);boxm(1.3,3.6,-0.75,0.75,zm-hh,zm+hh,acc)}
