    else if(r.type==='Wellhead'){cyl(z0,z0+r.h*0.55,1.25,steel);cyl(z0+r.h*0.55,z1,1.6,steel);boxm(-2.4,-1.2,-0.22,0.22,z0+r.h*0.2,z0+r.h*0.2+0.44,steel)}
    else if(r.type==='Bell nipple'){cyl(z0,z1,0.8,steel);boxm(0.7,2.4,-0.22,0.22,z1-r.h*0.45,z1-r.h*0.45+0.44,steel)}
    else cyl(z0,z1,1.3,steel);
    cyl(z0-0.06,z0+0.06,1.75,steel,20);labels.push({r,zm});z=z0});

function openPalette(){
  const old=document.querySelector('.modal.pal');if(old)old.remove();
  const m=document.createElement('div');m.className='modal pal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label','Search modules and formulas');
  m.innerHTML=`<div class="card"><label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="palq" type="search" placeholder="Search modules and formulas" autocomplete="off" aria-label="Search"></label><div class="palres" id="palres"></div><div class="row" style="justify-content:space-between"><span class="muted" style="font-size:12px">Enter opens the first result</span><button class="btn sm ghost" data-x>Close</button></div></div>`;
  document.body.appendChild(m);const inp=m.querySelector('#palq'),res=m.querySelector('#palres');
  const close=()=>{m.remove();document.removeEventListener('keydown',key)};
  const item=(k,sub)=>`<div class="pitem"><a href="#${k}" data-go="${k}"><span class="tic">${gico(MODG[k],18)}</span><span class="tx"><b>${esc(L(TITLES[k]))}</b><span>${esc(sub||DESC[k]||'')}</span></span></a>${starBtn(k)}</div>`;
  const draw=()=>{const q=inp.value.trim().toLowerCase();
    if(!q){const pins=S.pins.filter(k=>TITLES[k]),rec=S.recent.filter(k=>TITLES[k]&&!pins.includes(k));
      res.innerHTML=(pins.length?`<div class="ghead">${gico('star',15)}<span>Pinned</span></div>${pins.map(k=>item(k)).join('')}`:'')+(rec.length?`<div class="ghead">${gico('clock',15)}<span>Recent</span></div>${rec.map(k=>item(k)).join('')}`:'')+NAV.map(([g,it])=>`<div class="ghead">${gico(g,15)}<span>${L(g)}</span></div>${it.map(i=>item(i[0])).join('')}`).join('');return}
    const mods=Object.keys(TITLES).filter(k=>(TITLES[k]+' '+L(TITLES[k])+' '+(DESC[k]||'')+' '+MODG[k]).toLowerCase().includes(q));
    const fs=F.filter(f=>(f.n+' '+f.c+' '+LN(f)).toLowerCase().includes(q)).slice(0,10);
    res.innerHTML=(mods.length?`<div class="ghead"><span>Modules</span></div>${mods.map(k=>item(k)).join('')}`:'')+(fs.length?`<div class="ghead"><span>Formulas</span></div>${fs.map(f=>`<div class="pitem"><a href="#formulas" data-f="${esc(f.n)}"><span class="tic">${gico('Calculators',18)}</span><span class="tx"><b>${esc(LN(f))}</b><span>${esc(f.c)}</span></span></a></div>`).join('')}`:'')||`<p class="muted" style="padding:14px 6px">Nothing matches “${esc(inp.value)}”. Try a shorter word.</p>`};
  const go=a=>{if(a.dataset.f){FS.q=a.dataset.f;FS.cat='All';if(route()==='formulas')render();else location.hash='formulas'}else location.hash=a.dataset.go;close()};
  const key=e=>{if(e.key==='Escape')close();else if(e.key==='Enter'){const a=res.querySelector('.pitem a');if(a){e.preventDefault();go(a)}}};
  document.addEventListener('keydown',key);inp.oninput=draw;
  m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-x]'))return close();const a=e.target.closest('.pitem a');if(a){e.preventDefault();go(a)}});
  draw();inp.focus();
}

const lsFit=(X,y)=>{const n=X[0].length,A=Array.from({length:n},()=>Array(n+1).fill(0));X.forEach((r,i)=>{for(let a=0;a<n;a++){for(let b=0;b<n;b++)A[a][b]+=r[a]*r[b];A[a][n]+=r[a]*y[i]}});
  for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];if(Math.abs(A[c][c])<1e-12)return null;for(let r=0;r<n;r++){if(r===c)continue;const f=A[r][c]/A[c][c];for(let k=c;k<=n;k++)A[r][k]-=f*A[c][k]}}return A.map((r,i)=>r[n]/r[i])};
const r2=(y,yh)=>{const m=y.reduce((a,b)=>a+b,0)/y.length;const ss=y.reduce((a,b)=>a+(b-m)**2,0),se=y.reduce((a,b,i)=>a+(b-yh[i])**2,0);return ss?1-se/ss:NaN};
const rows=txt=>String(txt||'').split(/\n/).map(l=>l.trim()).filter(l=>l&&!/^#/.test(l)).map(l=>l.split(/[,;\t ]+/).map(num));
const card=(title,inner,id='')=>`<div class="card stack"${id?` id="${id}"`:''}><h3>${title}</h3>${inner}</div>`;

  const fit=()=>{const R=rows(d.txt).filter(r=>r.length>=4&&r.slice(0,4).every(Number.isFinite));if(R.length<8)return{n:R.length};const X=R.map(r=>[1,r[0],r[0]*r[0],r[1],r[1]*r[1],r[2]]),y=R.map(r=>r[3]);const b=lsFit(X,y);if(!b)return{n:R.length};const pred=x=>b[0]+b[1]*x[0]+b[2]*x[0]*x[0]+b[3]*x[1]+b[4]*x[1]*x[1]+b[5]*x[2];const yh=R.map(r=>pred(r));
    let best={rop:-1};for(let w=d.wmin;w<=d.wmax+1e-9;w+=(d.wmax-d.wmin)/40||1)for(let r=d.rmin;r<=d.rmax+1e-9;r+=(d.rmax-d.rmin)/40||1){const p=pred([w,r,d.mw]);if(p>best.rop)best={w,r,rop:p}}
    const cur=R.reduce((a,r)=>a+r[3],0)/R.length;return{n:R.length,R,b,yh,r2:r2(y,yh),best,cur,pred}};

    const lo=Math.min(...f.R.map(r=>r[3]),...f.yh),hi=Math.max(...f.R.map(r=>r[3]),...f.yh);const edge=[d.wmin,d.wmax].includes(+f.best.w.toFixed(6))||[d.rmin,d.rmax].includes(+f.best.r.toFixed(6));
    box.innerHTML=`<div class="readouts">${ro('Data points',f.n,'')}${ro('Model fit (R²)',fmt(f.r2,2),'',f.r2<0.5?'warn':'')}${ro('Average actual ROP',fmt(f.cur,1),'ft/hr')}${ro('Best predicted ROP',fmt(f.best.rop,1),'ft/hr','key')}</div>

  bindForm(v,d,'oilfield',key,calc);const base=v.oninput;v.oninput=v.onchange=e=>{if(e.target.id==='ropT'){d.txt=e.target.value;store.set(key,d);calc();return}base(e)};
  $('#ropFile').onclick=()=>$('#ropIn').click();$('#ropIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const lines=String(r.result).split(/\r?\n/);const hdr=lines[0].toLowerCase().split(/[,;\t]/).map(s=>s.trim());const ix=['wob','rpm','mw','rop'].map(k=>hdr.findIndex(h=>h.startsWith(k)));if(ix.every(i=>i>=0)){d.txt=lines.slice(1).map(l=>{const c=l.split(/[,;\t]/);return ix.map(i=>c[i]).join(', ')}).filter(l=>/\d/.test(l)).join('\n')}else d.txt=String(r.result);store.set(key,d);render();toast('Data loaded')};r.readAsText(f)};
  $('#xExp').onclick=()=>exportDialog({title:'ROP model',file:'ROP_Model',build:()=>{const f=fit();return{title:'ROP prediction',file:'ROP_Model',meta:f.b?[['Data points',f.n],['R²',fmt(f.r2,3)],['Recommended WOB',fmt(f.best.w,1)+' klbf'],['Recommended RPM',fmt(f.best.r,0)],['Predicted ROP',fmt(f.best.rop,1)+' ft/hr']]:[],tables:f.b?[{title:'Data',head:['WOB','RPM','MW','Actual ROP','Predicted ROP'],body:f.R.map((r,i)=>[r[0],r[1],r[2],r[3],fmt(f.yh[i],1)])}]:[]}}});

const MESH=[['40/60',0.0098,0.0165],['30/50',0.0117,0.0234],['20/40',0.0165,0.0331],['16/30',0.0234,0.0469],['12/20',0.0331,0.0661]];
PAGES.geomech=v=>{
  let d=Object.assign({tvd:10000,sv:1.0,sH:0.92,sh:0.75,pp:0.465,ucs:6000,phi:30,ts:0,mu:0.6,mw:11.6,isip:5200,ffw:8.6,clos:6900,clean:1200,pad:25,ppa:6,stg:5,d50:0.004},store.get(wkey('geo'),{}));const key=wkey('geo'),sys=S.sys;const F=a=>flds('ge-',a,d,sys);
  v.innerHTML=head('Geomechanics and stimulation','Wellbore stability window, stress polygon and breakout width for a vertical well, plus fracture pressures, a proppant schedule and gravel pack sizing. Example values are shown.')+
  `<div class="split">${card('Stresses and rock',`<div class="fields">${F([['tvd','True vertical depth','len'],['sv','Overburden gradient','grad'],['sH','Maximum horizontal stress gradient','grad'],['sh','Minimum horizontal stress gradient','grad'],['pp','Pore pressure gradient','grad'],['ucs','Rock strength (UCS)','pres'],['phi','Friction angle','°'],['ts','Tensile strength','pres'],['mu','Fault friction coefficient','–'],['mw','Planned mud weight','dens']])}</div>`)}<div class="stack" id="ge1"></div></div>
  <div class="grid g2">${card('Fracture treatment',`<div class="fields">${F([['isip','Instant shut-in pressure (surface)','pres'],['ffw','Frac fluid weight','dens'],['clos','Closure pressure','pres'],['clean','Total clean fluid','vol'],['pad','Pad fraction','%'],['ppa','Final proppant concentration','ppa'],['stg','Proppant stages','–']])}</div><div id="ge2"></div>`)}
  ${card('Gravel pack sizing (Saucier)',`<div class="fields">${F([['d50','Formation sand median grain size (D50)','in']])}</div><div id="ge3"></div>`)}</div>
  <p class="muted" style="font-size:12.5px">Vertical-well Kirsch stresses with Mohr–Coulomb failure; it ignores temperature, chemical effects, anisotropy and deviated well paths. Stress polygon uses frictional faulting limits. Fracture and gravel calculations are screening rules of thumb, not a frac simulator.</p>`;
  const calc=()=>{const g=x=>x*d.tvd;const SV=g(d.sv),SH=g(d.sH),Sh=g(d.sh),PP=g(d.pp);const q=(1+Math.sin(d.phi*Math.PI/180))/(1-Math.sin(d.phi*Math.PI/180));

function lasSample(){let s='~VERSION INFORMATION\n VERS. 2.0 : CWLS LOG ASCII STANDARD\n WRAP. NO\n~WELL INFORMATION\n STRT.FT 8000.0\n STOP.FT 8600.0\n STEP.FT 2.0\n NULL. -999.25\n WELL. EXAMPLE WELL (SYNTHETIC)\n~CURVE INFORMATION\n DEPT.FT : Depth\n GR.GAPI : Gamma ray\n RHOB.G/C3 : Bulk density\n NPHI.V/V : Neutron porosity\n RT.OHMM : Deep resistivity\n~A\n';
  for(let z=8000;z<=8600;z+=2){const sand=(z>8180&&z<8260)||(z>8400&&z<8470);const n=Math.sin(z*0.045)*4+Math.sin(z*0.011)*3;const gr=sand?35+n:105+n*2,rhob=sand?2.28+Math.sin(z)*0.02:2.55+Math.cos(z)*0.02,nphi=sand?0.21+Math.sin(z*0.5)*0.01:0.32+Math.sin(z*0.3)*0.02,rt=sand&&z<8260?45+n*3:sand?4+n*0.3:2.5+Math.abs(n)*0.2;s+=` ${z.toFixed(1)} ${gr.toFixed(2)} ${rhob.toFixed(3)} ${nphi.toFixed(3)} ${rt.toFixed(2)}\n`}return s}
function parseLAS(t){const lines=String(t).split(/\r?\n/);let sec='',nul=-999.25;const curves=[],data=[];const well={};for(const raw of lines){const l=raw.trim();if(!l||l[0]==='#')continue;if(l[0]==='~'){sec=l[1].toUpperCase();continue}
  if(sec==='W'){const m=/^([^.\s]+)\s*\.([^\s]*)\s+(.*?):/.exec(l+' :');if(m){well[m[1].toUpperCase()]=m[3].trim();if(m[1].toUpperCase()==='NULL')nul=num(m[3])}}
  else if(sec==='C'){const m=/^([^.\s]+)\s*\.([^\s:]*)/.exec(l);if(m)curves.push({name:m[1],unit:m[2]})}
  else if(sec==='A'){const v=l.split(/\s+/).map(num);if(v.length>=curves.length)data.push(v.map(x=>x===nul?NaN:x))}}return{well,curves,data}}
PAGES.las=v=>{
  let d=Object.assign({txt:lasSample(),sel:[1,2,3,4]},store.get('las',{}));
  const draw=()=>{const L=parseLAS(d.txt);const ok=L.curves.length>1&&L.data.length>2;
    v.innerHTML=head('Log viewer (LAS)','Open a LAS 2.0 well log file and plot its curves against depth. A synthetic example log is loaded.',`<button class="btn pri" id="lasB">Open LAS file</button><input type="file" id="lasIn" accept=".las,.txt" hidden>`)+
    (ok?`<div class="card"><dl class="kv"><dt>Well</dt><dd>${esc(L.well.WELL||'—')}</dd><dt>Depth range</dt><dd>${fmt(L.data[0][0])} – ${fmt(L.data[L.data.length-1][0])} ${esc(L.curves[0].unit)}</dd><dt>Curves</dt><dd>${L.curves.length-1}</dd><dt>Samples</dt><dd>${L.data.length}</dd></dl><div class="chips" style="margin-top:12px">${L.curves.slice(1).map((c,i)=>`<button class="chip" data-c="${i+1}" aria-pressed="${d.sel.includes(i+1)}">${esc(c.name)}${c.unit?' ('+esc(c.unit)+')':''}</button>`).join('')}</div></div>
    <div class="lastracks">${d.sel.filter(i=>L.curves[i]).map(i=>`<div class="card"><h3 style="margin-bottom:6px;font-size:15px">${esc(L.curves[i].name)}</h3>${lineChart({series:[{name:'',color:CSSV('--accent'),width:1.4,end:false,pts:L.data.filter(r=>Number.isFinite(r[i])).map(r=>[r[i],r[0]])}],xLabel:L.curves[i].unit||'',yLabel:'Depth',yInvert:true,w:260,h:560})}</div>`).join('')}</div>`:'<div class="note crit">This file could not be read as LAS 2.0. Check that it has ~C (curve) and ~A (data) sections.</div>');
    const b=$('#lasB');if(b)b.onclick=()=>$('#lasIn').click();const inp=$('#lasIn');if(inp)inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{d.txt=String(r.result);const P=parseLAS(d.txt);d.sel=P.curves.slice(1,5).map((_,i)=>i+1);try{store.set('las',d)}catch(err){}draw();toast('Log loaded')};r.readAsText(f)}};
  v.onclick=e=>{const c=e.target.closest('[data-c]');if(!c)return;const i=+c.dataset.c;d.sel=d.sel.includes(i)?d.sel.filter(x=>x!==i):[...d.sel,i].slice(-6);store.set('las',d);draw()};
  draw();
};
